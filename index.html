<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Equilouds 99 Loops. Mesmerizing and adorable code based animations for free.">
<title>Equilouds 99 Loops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }
/* Equilouds 99 Loops · Layout: Galerie-Raster aus 99 laufenden Designs; Equiloud-Palette Schwarz, Weiß, Orange; Code-Ansicht als Dialog */
:root {
  --bg: #151419;
  --panel: #1b1b1e;
  --line: rgba(251, 251, 251, .12);
  --fg: #fbfbfb;
  --mute: #a9a8ad;
  --accent: #f56e0f;
  --ink: #151419;
  --display: "Poppins", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --body: "Poppins", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1360px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .tile:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--mono); font-size: .88em; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--fg); min-width: 0; }
.brand img { width: 44px; height: 44px; flex: none; }
.brand .name { display: grid; line-height: 1.15; min-width: 0; }
.brand .name b { font-weight: 700; font-size: 15px; letter-spacing: .06em; }
.brand .name span { font-size: 11.5px; color: var(--mute); white-space: nowrap; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.btn { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--mute); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.info { width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); font-family: var(--mono); font-weight: 600; font-size: 14px; background: transparent; flex: none; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.lang button { border: 0; background: transparent; border-radius: 999px; padding: 4px 10px; font-family: var(--mono); font-size: 12px; color: var(--mute); }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--ink); }

.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; padding-block: 52px 32px; align-items: end; }
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(44px, 8.4vw, 116px); line-height: .9; letter-spacing: -.02em; margin: 12px 0 0; }
h1 em { font-style: normal; color: var(--accent); }
.big99 { font-family: var(--display); font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.hero p { margin: 0; color: var(--mute); max-width: 54ch; font-size: 16px; }
.hero p.lead { color: var(--fg); font-family: var(--display); font-weight: 600; font-size: clamp(19px, 2vw, 24px); line-height: 1.25; margin-bottom: 12px; text-wrap: balance; }
.specs { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 18px; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.specs b { color: var(--accent); font-weight: 600; }

.bar { display: grid; gap: 10px; padding-block: 14px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 13px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--ink); border-color: var(--fg); }
.chip .n { font-family: var(--mono); font-size: 11px; opacity: .65; margin-left: 4px; }
.themes .chip { padding: 4px 10px; font-size: 12px; }
.themes .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.themes { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
.themes::-webkit-scrollbar { display: none; }
.themes .chip { flex: none; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 26px 18px; padding-block: 26px 64px; }
.sec { grid-column: 1 / -1; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 2px 16px; padding-top: 22px; margin-top: 8px; border-top: 1px solid var(--line); }
.sec:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
.sec .range { grid-row: span 2; font-family: var(--mono); font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
.sec h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(20px, 2.2vw, 26px); line-height: 1.1; }
.sec p { margin: 0; color: var(--mute); font-size: 14px; }
.empty { padding: 48px 0; color: var(--mute); text-align: center; grid-column: 1 / -1; }
.tile { display: flex; flex-direction: column; gap: 9px; cursor: pointer; min-width: 0; border-radius: 6px; }
.frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 6px; overflow: hidden; background: var(--panel); }
.frame canvas { display: block; width: 100%; height: 100%; }
.frame .open { position: absolute; right: 10px; bottom: 10px; z-index: 2; pointer-events: none; font-family: var(--mono); font-size: 11px; background: rgba(21,20,25,.85); color: var(--fg); border: 1px solid var(--line); padding: 4px 9px; border-radius: 999px; opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; }
.tile:hover .open, .tile:focus-visible .open { opacity: 1; transform: none; }
.meta { display: flex; align-items: baseline; gap: 10px; }
.meta .no { font-family: var(--mono); font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
.meta .name { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 3px; border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
.tag.pack { border-color: var(--accent); color: var(--accent); }

.made { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 32px; padding-block: 48px; border-top: 1px solid var(--line); }
.made h2 { font-family: var(--display); font-size: 28px; line-height: 1.05; margin: 8px 0 0; text-wrap: balance; }
.made ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
.made li { padding-left: 18px; position: relative; color: var(--mute); max-width: 62ch; }
.made li::before { content: ""; position: absolute; left: 0; top: .62em; width: 7px; height: 7px; background: var(--accent); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
.made li b { color: var(--fg); font-weight: 600; }
footer { padding-block: 22px 40px; border-top: 1px solid var(--line); color: var(--mute); font-size: 13px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }

dialog { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 10px; padding: 0; width: min(1180px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
dialog::backdrop { background: rgba(0,0,0,.8); }
.dlg { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); max-height: calc(100vh - 26px); }
.dlg-left { padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; overflow: auto; }
.dlg-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; }
.dlg-head h3 { margin: 0; font-family: var(--display); font-size: 24px; }
.dlg-themes { font-family: var(--mono); font-size: 11px; color: var(--mute); }
.dlg-desc { color: var(--mute); margin: 0; max-width: 60ch; }
.palette { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.swatch { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--mute); }
.swatch input { width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: none; cursor: pointer; }
.swatch input::-webkit-color-swatch-wrapper { padding: 0; }
.swatch input::-webkit-color-swatch { border: none; border-radius: 50%; }
.presets { display: flex; gap: 6px; margin-left: auto; }
.presets button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); padding: 0; }
.steps { margin: 0; padding-left: 20px; color: var(--mute); font-size: 14px; display: grid; gap: 4px; }
.steps code { color: var(--fg); }
.pack-note { border: 1px dashed var(--accent); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
.pack-note b { color: var(--accent); }
.dlg-right { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.code-bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.code-bar span { font-family: var(--mono); font-size: 12px; color: var(--mute); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
pre { margin: 0; padding: 14px; overflow: auto; font-family: var(--mono); font-size: 12px; line-height: 1.55; color: var(--fg); flex: 1; min-height: 0; white-space: pre; tab-size: 2; }
.close { margin-left: auto; background: var(--bg); }

.help { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(70px + env(safe-area-inset-top, 0px)); width: min(340px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 16px 18px; z-index: 20; font-size: 13.5px; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
.help h4 { margin: 0 0 8px; font-family: var(--mono); font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.help ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; color: var(--mute); }
.help b { color: var(--fg); }

@media (max-width: 860px) {
  .hero, .made { grid-template-columns: 1fr; }
  .dlg { grid-template-columns: 1fr; overflow: auto; }
  .dlg-right { border-left: none; border-top: 1px solid var(--line); }
  pre { max-height: 50vh; }
  .brand .name span { display: none; }
  #pauseAll { display: none; }
}
@media (prefers-reduced-motion: reduce) { .frame .open { transition: none; } }
</style>
</head>

<script>
function hexField(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const r = H / 14, w = Math.sqrt(3) * r;
  const cols = Math.ceil(W / w) + 2, rows = Math.ceil(H / (r * 1.5)) + 2;
  for (let j = -1; j < rows; j++) {
    for (let i = -1; i < cols; i++) {
      const x = i * w + (j % 2 ? w / 2 : 0), y = j * r * 1.5;
      const d = Math.hypot(x - W / 2, y - H / 2) / H;
      const k = 0.5 + 0.5 * Math.sin(TAU * t * 2 - d * 9);
      const s = r * (0.25 + 0.68 * k);
      c.beginPath();
      for (let a = 0; a < 6; a++) {
        const ang = TAU * a / 6 + Math.PI / 6;
        c.lineTo(x + s * Math.cos(ang), y + s * Math.sin(ang));
      }
      c.closePath();
      c.fillStyle = k > 0.82 ? P.accent : P.fg;
      c.globalAlpha = 0.2 + 0.8 * k;
      c.fill();
    }
  }
  c.globalAlpha = 1;
}

function contourDrift(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  c.lineWidth = H / 360;
  const R = Math.hypot(W, H) / 2, n = 28;
  for (let i = 0; i < n; i++) {
    const base = ((i + t * 7) % n) / n * R;
    c.beginPath();
    for (let a = 0; a <= 140; a++) {
      const th = TAU * a / 140;
      const wob = 1 + 0.09 * Math.sin(3 * th + TAU * t) + 0.05 * Math.sin(5 * th - TAU * t * 2);
      c.lineTo(W / 2 + base * wob * Math.cos(th), H / 2 + base * wob * Math.sin(th));
    }
    c.globalAlpha = Math.min(1, base / R * 3);
    c.strokeStyle = i % 7 === 0 ? P.accent : P.fg;
    c.stroke();
  }
  c.globalAlpha = 1;
}

function plexus(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const N = 70, pts = [];
  for (let i = 0; i < N; i++) {
    const h1 = Math.sin(i * 12.9898) * 43758.5453, r1 = h1 - Math.floor(h1);
    const h2 = Math.sin(i * 78.233) * 12543.123, r2 = h2 - Math.floor(h2);
    const fx = 1 + (i % 3), fy = 1 + ((i + 1) % 2);
    const x = W * (0.5 + 0.5 * Math.sin(TAU * (t * fx + r1)) * (0.35 + 0.65 * r2));
    const y = H * (0.5 + 0.48 * Math.cos(TAU * (t * fy + r2)) * (0.4 + 0.6 * r1));
    pts.push([x, y]);
  }
  const L = H / 4.5;
  c.lineWidth = Math.max(1, H / 900);
  c.strokeStyle = P.fg;
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {

function isoCubes(c, t, W, H, P) {

function tangram(c, t, W, H, P) {
  const TAU = Math.PI * 2, ph = t % 1;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const hx = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));

  const PIECES = [
    { g: 0, col: P.accent, pts: [[0, 0], [4, 0], [2, 2]] },
    { g: 0, col: tone(0.92), pts: [[0, 0], [2, 2], [0, 4]] },
    { g: 1, col: tone(0.55), pts: [[4, 2], [4, 4], [2, 4]] },
    { g: 1, col: tone(0.78), pts: [[2, 2], [3, 1], [4, 2], [3, 3]] },
    { g: 1, col: P.accent, pts: [[3, 1], [4, 0], [4, 2]] },
    { g: 1, col: tone(0.4), pts: [[1, 3], [2, 2], [3, 3]] },

    [[0, 0, 0], [0, 0, 0]],                       // Quadrat
    [[Math.PI, 0, 4], [Math.PI / 2, 4, 0]],       // Dreieck (Berg)
    [[Math.PI / 2, 0, 0], [Math.PI / 2, 4, 0]]    // Parallelogramm

  const centre = pose => { let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; PIECES.forEach(pc => pc.pts.forEach(p => { const q = tf(p, pose[pc.g]); x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); })); return [(x0 + x1) / 2, (y0 + y1) / 2]; };

    const ctr = [cf[0] + (ct[0] - cf[0]) * e, cf[1] + (ct[1] - cf[1]) * e];
    const local = pc.pts.map(p => tf(p, pose)), gx = local.reduce((a, q) => a + q[0], 0) / local.length, gy = local.reduce((a, q) => a + q[1], 0) / local.length;

function signalBars(c, t, W, H, P) {

function lowPolyDrift(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const cols = 14, rows = 9, sx = W / (cols - 3), sy = H / (rows - 3);
  const pt = [];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const h = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453, r = h - Math.floor(h);
    const x = (i - 1) * sx + (j % 2 ? sx / 2 : 0) + sx * 0.3 * Math.sin(TAU * (t + r));
    const y = (j - 1) * sy + sy * 0.3 * Math.cos(TAU * (t * (1 + (i % 2)) + r));
    const z = Math.sin(TAU * (t + i * 0.09 + j * 0.13));
    pt.push([x, y, z]);
  }
  const at = (i, j) => pt[j * cols + i];
  c.lineJoin = 'round'; c.lineWidth = Math.max(1, H / 900);
  for (let j = 0; j < rows - 1; j++) for (let i = 0; i < cols - 1; i++) {
    const a = at(i, j), b = at(i + 1, j), d = at(i, j + 1), e = at(i + 1, j + 1);
    const tris = j % 2 ? [[a, e, d], [a, b, e]] : [[a, b, d], [b, e, d]];
    for (const [p, q, r] of tris) {
      const ux = q[0] - p[0], uy = q[1] - p[1], uz = (q[2] - p[2]) * sy;
      const vx = r[0] - p[0], vy = r[1] - p[1], vz = (r[2] - p[2]) * sy;

      c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.lineTo(r[0], r[1]); c.closePath();

      c.globalAlpha = 0.3; c.strokeStyle = P.accent; c.stroke();
    }

  c.globalAlpha = 1; c.fillStyle = P.accent;
  pt.forEach(([x, y, z]) => { if (z > 0.8) { c.beginPath(); c.arc(x, y, H / 160, 0, TAU); c.fill(); } });
}

function synthHorizon(c, t, W, H, P) {

function rainLines(c, t, W, H, P) {
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);

function opArtWarp(c, t, W, H, P) {
  const TAU = Math.PI * 2;

  }

function silkStrings(c, t, W, H, P) {

function dotTunnel(c, t, W, H, P) {

function orbitRings(c, t, W, H, P) {

function hexMorph(c, t, W, H, P) {
  const TAU = Math.PI * 2, seg = TAU / 6;

    const rr = R * (1 - layer * 0.15);

function truchetFlip(c, t, W, H, P) {

function pendulumWave(c, t, W, H, P) {

function loaderArcs(c, t, W, H, P) {

function newtonsCradle(c, t, W, H, P) {

  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);

function blobMorph(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  for (let L = 0; L < 3; L++) {
    const R = H * (0.32 - L * 0.08);
    c.beginPath();
    for (let a = 0; a <= 200; a++) {
      const th = TAU * a / 200;
      const r = R * (1 + 0.12 * Math.sin(3 * th + TAU * t + L) + 0.08 * Math.sin(5 * th - TAU * t * 2 + L * 2) + 0.05 * Math.sin(2 * th + TAU * t * 3));

    }
    c.closePath();
    c.fillStyle = L === 0 ? P.fg : L === 1 ? P.accent : P.bg;
    c.fill();
  }
}

function wireCube(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const V = []; for (let i = 0; i < 8; i++) V.push([i & 1 ? 1 : -1, i & 2 ? 1 : -1, i & 4 ? 1 : -1]);
  const E = []; for (let i = 0; i < 8; i++) for (const b of [1, 2, 4]) if (!(i & b)) E.push([i, i | b]);

    const pts = V.map(([x, y, z]) => {
      const X = x * Math.cos(ay) + z * Math.sin(ay), Z0 = -x * Math.sin(ay) + z * Math.cos(ay);
      const Y = y * Math.cos(ax) - Z0 * Math.sin(ax), Z = y * Math.sin(ax) + Z0 * Math.cos(ax);

    pts.forEach(p => { c.beginPath(); c.arc(p[0], p[1], lw * 1.8, 0, TAU); c.fill(); });

function infinityTrail(c, t, W, H, P) {

  c.lineCap = 'round';
  for (let j = 0; j < 2; j++) {
    const head = TAU * (t * 2 + j * 0.5);
    c.strokeStyle = j ? P.fg : P.accent;
    for (let k = 0; k < 60; k++) {

    }
  }

}

function checkDraw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const ph = (t * 2) % 1, ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);

  c.globalAlpha = 1 - out;

  const p1 = [-R * 0.42, R * 0.02], p2 = [-R * 0.12, R * 0.32], p3 = [R * 0.45, -R * 0.3];

function spirograph(c, t, W, H, P) {

function radialEQ(c, t, W, H, P) {

function gearPair(c, t, W, H, P) {

function noiseCube(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const N = 6;   // 6 oder 12 Würfel pro Kante / 6 or 12 cubes per edge

  const B = hx(P.bg), F = hx(P.fg), A = hx(P.accent);
  const mix = (X, k) => 'rgb(' + B.map((b, i) => Math.round(b + (X[i] - b) * k)).join(',') + ')';

    const X = x * Math.cos(ay) + z * Math.sin(ay), Z0 = -x * Math.sin(ay) + z * Math.cos(ay);
    return [X, y * Math.cos(ax) - Z0 * Math.sin(ax), y * Math.sin(ax) + Z0 * Math.cos(ax)];
  };
  const ex = rot([1, 0, 0]), ey = rot([0, 1, 0]), ez = rot([0, 0, 1]), L = [-0.45, -0.7, -0.55];
  const faces = [];
  [[ex, 1], [ex, -1], [ey, 1], [ey, -1], [ez, 1], [ez, -1]].forEach(([n, s]) => {
    const nn = n.map(v => v * s);
    if (nn[2] < 0) faces.push({ n: nn, u: n === ex ? ey : ex, v: n === ez ? ey : ez, lit: Math.max(0, nn[0] * L[0] + nn[1] * L[1] + nn[2] * L[2]) });
  });

    const x = -1 + cell * (i + 0.5), y = -1 + cell * (j + 0.5), z = -1 + cell * (k + 0.5);
    const id = i * 131 + j * 17 + k * 7 + 1, r1 = rnd(id * 1.7), r2 = rnd(id * 3.3);
    const field = Math.sin(x * 2.1 + TAU * t) * Math.sin(y * 1.7 - TAU * t * 2 + 1) * Math.sin(z * 2.4 + TAU * t + 2);

    faces.forEach(f => {
      const cx = p[0] + f.n[0] * h, cy = p[1] + f.n[1] * h, cz = p[2] + f.n[2] * h;
      c.beginPath();

function buildLoopHTML(loop, P) {
  const L = tr();
  const src = loop.fn.toString().replace(/^function\s+\w+/, 'function draw');
  const pal = '{ bg: \'' + P.bg + '\', fg: \'' + P.fg + '\', accent: \'' + P.accent + '\' }';
  return `<!doctype html>
<html lang="${lang}">
<head>
<meta charset="utf-8">
<title>${loop.name} · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: ${P.bg}; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// ${loop.name} (${loop.id}) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// ${L.exLicense}
const W = 1920, H = 1080;   // ${L.exSize}
const DUR = 12;             // ${L.exDur}
const P = ${pal};

${src}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
<\/script>
</body>
</html>`;
}

const grid = document.getElementById('grid');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let paused = false, pausedAt = 0, offset = 0;
let fCat = 'all', fSec = 'all';
const tiles = [], visible = new Set(), hosts = [];

const count = cat => ALL.filter(l => l.cat === cat).length;
const fWrap = document.getElementById('filters'), thWrap = document.getElementById('themes');
const CATS = [['all', ALL.length], ['bg', count('bg')], ['shape', count('shape')], ['button', count('button')]];

function chip(wrap, key, cur, onClick) {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.dataset.k = key;
  b.setAttribute('aria-pressed', String(key === cur));
  b.addEventListener('click', () => onClick(key));
  wrap.appendChild(b); return b;
}
CATS.forEach(([k]) => chip(fWrap, k, fCat, k2 => { fCat = k2; applyFilter(); }));
['all', ...SEC_KEYS].forEach(k => chip(thWrap, k, fSec, k2 => { fSec = k2; applyFilter(); }));

const empty = document.createElement('div'); empty.className = 'empty'; empty.hidden = true;

function applyFilter() {
  fWrap.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.k === fCat)));
  thWrap.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.k === fSec)));
  let shown = 0;
  tiles.forEach(tl => {
    const l = tl.item;
    const okC = fCat === 'all' || l.cat === fCat;
    const okT = fSec === 'all' || l.sec === fSec;
    tl.el.hidden = !(okC && okT); if (!tl.el.hidden) shown++;
  });
  Object.entries(heads).forEach(([k, h]) => { h.hidden = !tiles.some(tl => tl.item.sec === k && !tl.el.hidden); });
  empty.hidden = shown > 0;
  try { localStorage.setItem('cl-filter', fCat + '|' + fSec); } catch (e) {}
  requestAnimationFrame(() => { resizeAll(); if (paused) renderStill(); });
}

const io = new IntersectionObserver(entries => {
  entries.forEach(en => { en.isIntersecting ? visible.add(en.target._tile) : visible.delete(en.target._tile); });
}, { rootMargin: '100px' });

function setVars(host, P) { host.style.setProperty('--bg', P.bg); host.style.setProperty('--fg', P.fg); host.style.setProperty('--accent', P.accent); }
function mountButton(host, b, P, px) {
  const root = host.shadowRoot || host.attachShadow({ mode: 'open' });
  root.innerHTML = '<style>:host{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);font-size:' + px + 'px}' +
    ':host([data-paused]) *,:host([data-paused]) *::before,:host([data-paused]) *::after{animation-play-state:paused!important}' +
    b.css + '</style>' + btnMarkup(b);
  setVars(host, P);
  if (!host._bound) {
    root.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a'); if (a) e.preventDefault(); });
    host._bound = true;
  }
}

const heads = {};
ALL.forEach(item => {
  if (!heads[item.sec]) {
    const its = ALL.filter(x => x.sec === item.sec);
    const hd = document.createElement('div'); hd.className = 'sec';
    hd.innerHTML = '<span class="range">' + its[0].id + '–' + its[its.length - 1].id + '</span><h2></h2><p></p>';
    heads[item.sec] = hd; grid.appendChild(hd);
  }
  const el = document.createElement('div');
  el.className = 'tile'; el.tabIndex = 0; el.setAttribute('role', 'button');
  const tag = item.cat === 'button' ? '<span class="tag">CSS</span>' : '<span class="tag">Canvas</span>';
  el.innerHTML = `<div class="frame">${item.fn ? '<canvas></canvas>' : '<div class="host"></div>'}<span class="open"></span></div>
    <div class="meta"><span class="no">${item.id}</span><span class="name">${item.name}</span>${tag}</div>`;
  const tile = { el, item };
  if (item.fn) {
    tile.cv = el.querySelector('canvas'); tile.ctx = tile.cv.getContext('2d');
    tile.cv._tile = tile; io.observe(tile.cv);
  } else {
    tile.host = el.querySelector('.host');
    mountButton(tile.host, item, item.P, 15);
    hosts.push(tile.host);
  }
  tiles.push(tile);
  grid.appendChild(el);
  el.addEventListener('click', () => openItem(item));
  el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === el) { e.preventDefault(); openItem(item); } });
});
grid.appendChild(empty);

function sizeCanvas(cv) {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.max(2, Math.round(cv.clientWidth * dpr)), h = Math.max(2, Math.round(cv.clientHeight * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
}
function resizeAll() { tiles.forEach(tl => tl.cv && !tl.el.hidden && sizeCanvas(tl.cv)); if (dlg.open && !dCanvas.hidden) sizeCanvas(dCanvas); }
addEventListener('resize', () => { resizeAll(); if (paused) renderStill(); });

function phase(now) { return (((paused ? pausedAt : now) - offset) / 1000 / DUR) % 1; }
function drawTile(tl, t) { tl.item.fn(tl.ctx, t, tl.cv.width, tl.cv.height, tl.item.P); }

function frame(now) {
  if (!paused) {
    const t = phase(now);
    if (dlg.open) { if (dActive && dActive.item.fn) dActive.item.fn(dCtx, t, dCanvas.width, dCanvas.height, dActive.P); }
    else visible.forEach(tl => { if (!tl.el.hidden) drawTile(tl, t); });
  }
  requestAnimationFrame(frame);
}

const pauseBtn = document.getElementById('pauseAll');
function setPaused(p) {
  const now = performance.now();
  if (p && !paused) pausedAt = now;
  if (!p && paused) offset += now - pausedAt;
  paused = p;
  pauseBtn.textContent = paused ? tr().play : tr().pause;
  [...hosts, dHost].forEach(h => p ? h.setAttribute('data-paused', '') : h.removeAttribute('data-paused'));
}
pauseBtn.addEventListener('click', () => setPaused(!paused));

/* ---------- Dialog ---------- */
const dlg = document.getElementById('dlg');
const dCanvas = document.getElementById('dlgCanvas');
const dHost = document.getElementById('dlgHost');
const dCtx = dCanvas.getContext('2d');
const codeEl = document.getElementById('code');
let dActive = null;

function renderStill() {
  const t = phase(performance.now());
  if (dlg.open && dActive && dActive.item.fn) dActive.item.fn(dCtx, t, dCanvas.width, dCanvas.height, dActive.P);
  tiles.forEach(tl => { if (tl.cv && !tl.el.hidden) drawTile(tl, t); });
}

function fillDialogText() {
  const L = tr(), item = dActive.item, isBtn = !item.fn;
  document.getElementById('dlgDesc').textContent = item.desc[lang];
  document.getElementById('dlgThemes').textContent = item.th.map(k => L.themes[k]).join(' · ');
  document.getElementById('steps').innerHTML = (isBtn ? L.stepsBtn : L.stepsLoop).map(s => '<li>' + s + '</li>').join('');
  document.querySelectorAll('#palette .swatch span').forEach(sp => sp.textContent = L[sp.dataset.k]);
  const pr = document.querySelector('#palette .presets'); if (pr) pr.setAttribute('aria-label', L.presets);
  if (isBtn) mountButton(dHost, item, dActive.P, 22);
  updateCode();
}

function buildPalette() {
  const pal = document.getElementById('palette');
  pal.innerHTML = '';
  [['bg', 'palBg'], ['fg', 'palFg'], ['accent', 'palAc']].forEach(([k, lk]) => {
    const id = 'col-' + k;
    const lab = document.createElement('label');
    lab.className = 'swatch'; lab.htmlFor = id;
    lab.innerHTML = `<input type="color" id="${id}" value="${dActive.P[k]}"> <span data-k="${lk}"></span>`;
    lab.querySelector('input').addEventListener('input', e => { dActive.P[k] = e.target.value; refreshPalette(); });
    pal.appendChild(lab);
  });
  const pr = document.createElement('div'); pr.className = 'presets'; pr.setAttribute('role', 'group');
  Object.entries(SCHEMES).forEach(([key, s]) => {
    const b = document.createElement('button'); b.type = 'button';
    b.style.background = `linear-gradient(135deg, ${s.bg} 0 50%, ${s.accent} 50% 75%, ${s.fg} 75%)`;
    b.setAttribute('aria-label', key);
    b.addEventListener('click', () => { dActive.P = { ...s }; ['bg', 'fg', 'accent'].forEach(k => { document.getElementById('col-' + k).value = s[k]; }); refreshPalette(); });
    pr.appendChild(b);
  });
  pal.appendChild(pr);
}
function refreshPalette() {
  if (!dActive.item.fn) setVars(dHost, dActive.P);
  updateCode();
  if (paused) renderStill();
}

function openItem(item) {
  dActive = { item, P: { ...item.P } };
  const isBtn = !item.fn;
  document.getElementById('dlgTitle').textContent = item.name;
  const tag = document.getElementById('dlgTag');
  tag.textContent = isBtn ? 'CSS' : 'Canvas';
  tag.className = 'tag';
  dCanvas.hidden = isBtn; dHost.hidden = !isBtn;
  buildPalette();
  fillDialogText();
  if (isBtn && paused) dHost.setAttribute('data-paused', '');
  dlg.showModal();
  if (!isBtn) sizeCanvas(dCanvas);
  renderStill();
}
function updateCode() {
  const it = dActive.item;
  const html = it.fn ? buildLoopHTML(it, dActive.P) : buildButtonHTML(it, dActive.P);
  codeEl.textContent = html;
  document.getElementById('codeInfo').textContent = `${it.id.toLowerCase()}-${it.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.html · ${html.split('\n').length} ${tr().lines}`;
}
document.getElementById('dlgClose').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener('close', () => { if (paused) renderStill(); });

const copyBtn = document.getElementById('copyBtn');
copyBtn.addEventListener('click', () => {
  const L = tr();
  const done = () => { copyBtn.textContent = L.copied; setTimeout(() => copyBtn.textContent = tr().copy, 1600); };
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(codeEl);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    copyBtn.textContent = L.selected;
    setTimeout(() => copyBtn.textContent = tr().copy, 2400);
  };
  try { navigator.clipboard.writeText(codeEl.textContent).then(done, fallback); } catch (e) { fallback(); }
});

/* ---------- Hilfe ---------- */
const help = document.getElementById('help'), infoBtn = document.getElementById('infoBtn');
infoBtn.addEventListener('click', () => { help.hidden = !help.hidden; infoBtn.setAttribute('aria-expanded', String(!help.hidden)); });
document.addEventListener('click', e => { if (!help.hidden && !help.contains(e.target) && e.target !== infoBtn) { help.hidden = true; infoBtn.setAttribute('aria-expanded', 'false'); } });

/* ---------- Sprache ---------- */
function applyLang() {
  const L = tr();
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  pauseBtn.textContent = paused ? L.play : L.pause;
  infoBtn.setAttribute('aria-label', L.info);
  document.getElementById('tEyebrow').textContent = L.eyebrow;
  document.getElementById('tHero').textContent = L.hero;
  document.getElementById('specs').innerHTML = `<span><b class="big99">${ALL.length}</b> ${L.designs}</span><span><b>${count('bg')}</b> ${L.bg}</span><span><b>${count('shape')}</b> ${L.shape}</span><span><b>${count('button')}</b> ${L.button}</span><span>${L.period} <b>12 s</b></span><span>${L.deps}</span>`;
  document.getElementById('tBar').textContent = L.bar;
  fWrap.setAttribute('aria-label', L.all); thWrap.setAttribute('aria-label', L.allThemes);
  fWrap.querySelectorAll('.chip').forEach(b => { const n = CATS.find(c => c[0] === b.dataset.k)[1]; b.innerHTML = L[b.dataset.k] + '<span class="n">' + n + '</span>'; });
  thWrap.querySelectorAll('.chip').forEach(b => { const k = b.dataset.k; b.innerHTML = k === 'all' ? L.allThemes : L.sec[k][0] + '<span class="n">' + ALL.filter(x => x.sec === k).length + '</span>'; });
  Object.entries(heads).forEach(([k, h]) => { h.querySelector('h2').textContent = L.sec[k][0]; h.querySelector('p').textContent = L.sec[k][1]; });
  empty.textContent = L.empty;
  document.getElementById('tMadeEyebrow').textContent = L.madeEyebrow;
  document.getElementById('tMadeH').textContent = L.madeH;
  document.getElementById('tMade').innerHTML = L.made.map(s => '<li>' + s + '</li>').join('');
  document.getElementById('tHelpH').textContent = L.helpH;
  document.getElementById('tHelp').innerHTML = L.help.map(s => '<li>' + s + '</li>').join('');
  document.getElementById('dlgClose').textContent = L.close;
  copyBtn.textContent = L.copy;
  tiles.forEach(tl => {
    tl.el.querySelector('.open').textContent = L.open;
    tl.el.setAttribute('aria-label', tl.item.name + ' ' + L.openAria);
    if (tl.host) mountButton(tl.host, tl.item, tl.item.P, 15);
  });
  if (dlg.open && dActive) fillDialogText();
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('cl-lang', lang); } catch (e) {}
  applyLang();
}));

/* ---------- Start ---------- */
try {
  const f = (localStorage.getItem('cl-filter') || '').split('|');
  if (f[0] && CATS.some(c => c[0] === f[0])) fCat = f[0];
  if (f[1] && (f[1] === 'all' || SEC_KEYS.includes(f[1]))) fSec = f[1];
} catch (e) {}
applyLang();
applyFilter();
resizeAll();
if (reduce) { setPaused(true); pausedAt = performance.now() - DUR * 1000 * 0.3; offset = 0; }
renderStill();
requestAnimationFrame(frame);
</script>

</body>
</html>
