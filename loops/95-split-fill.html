<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split Fill · Equilouds 99 Loops</title>
<style>
  /* Split Fill (95) · Equilouds 99 Loops · uweschweerlambers.de · License: MIT, free to use, commercial use included */
  :root { --bg: #151419; --fg: #fbfbfb; --accent: #f56e0f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font-size: 18px; }

.btn-split { position: relative; overflow: hidden; padding: .95em 2em; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font: 700 1em/1 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; isolation: isolate; transition: color .35s; }
.btn-split::before, .btn-split::after { content: ""; position: absolute; top: 0; bottom: 0; width: 51%; background: var(--accent); z-index: -1; transition: transform .45s cubic-bezier(.7,0,.2,1); }
.btn-split::before { left: 0; transform: translateX(-101%); animation: peekL 3.2s ease-in-out infinite; }
.btn-split::after { right: 0; transform: translateX(101%); animation: peekR 3.2s ease-in-out infinite; }
.btn-split:hover { color: var(--bg); }
.btn-split:hover::before, .btn-split:hover::after { transform: none; animation: none; }
@keyframes peekL { 0%, 60%, 100% { transform: translateX(-101%); } 78% { transform: translateX(-82%); } }
@keyframes peekR { 0%, 60%, 100% { transform: translateX(101%); } 78% { transform: translateX(82%); } }
</style>
</head>
<body>
  <button class="btn-split">Learn more</button>
</body>
</html>
