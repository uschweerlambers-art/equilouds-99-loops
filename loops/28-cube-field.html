<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Field · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Cube Field (28) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const hx = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));
  const B = hx(P.bg), F = hx(P.fg);
  const mix = k => 'rgb(' + B.map((b, i) => Math.round(b + (F[i] - b) * k)).join(',') + ')';
  const V = []; for (let i = 0; i < 8; i++) V.push([i & 1 ? 1 : -1, i & 2 ? 1 : -1, i & 4 ? 1 : -1]);
  const FACES = [[0, 1, 3, 2], [4, 5, 7, 6], [0, 1, 5, 4], [2, 3, 7, 6], [0, 2, 6, 4], [1, 3, 7, 5]];
  const Lx = -0.45, Ly = -0.7, Lz = -0.55;
  const g = H / 5, cols = Math.ceil(W / g) + 1;
  for (let j = 0; j < 6; j++) for (let i = 0; i < cols; i++) {
    const ay = TAU * t + (i + j) * 0.35, ax = 0.6 + 0.35 * Math.sin(TAU * t + i * 0.5 - j * 0.3);
    const sz = g * 0.26 * (0.85 + 0.15 * Math.sin(TAU * (t * 2 - i * 0.1)));
    const cx = (i + (j % 2 ? 0.5 : 0)) * g, cy = j * g * 0.88 - g * 0.2;
    const pts = V.map(([x, y, z]) => {
      const X = x * Math.cos(ay) + z * Math.sin(ay), Z0 = -x * Math.sin(ay) + z * Math.cos(ay);
      return [X, y * Math.cos(ax) - Z0 * Math.sin(ax), y * Math.sin(ax) + Z0 * Math.cos(ax)];
    });
    const fs = FACES.map(f => {
      const p = f.map(k => pts[k]);
      let n = [0, 1, 2].map(k => (p[0][k] + p[2][k]) / 2);
      const l = Math.hypot(n[0], n[1], n[2]); n = n.map(v => v / l);
      return { p, n, z: (p[0][2] + p[2][2]) / 2 };
    }).filter(f => f.n[2] < 0).sort((a, b) => b.z - a.z);
    fs.forEach(f => {
      const lit = Math.max(0, f.n[0] * Lx + f.n[1] * Ly + f.n[2] * Lz);
      c.beginPath(); f.p.forEach(q => c.lineTo(cx + q[0] * sz, cy + q[1] * sz)); c.closePath();
      c.fillStyle = (i * 3 + j * 5) % 11 === 0 && lit > 0.6 ? P.accent : mix(0.12 + 0.88 * lit); c.fill();
    });
  }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
