<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plexus Sphere · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Plexus Sphere (02) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const N = 140, R = H * 0.38, ga = Math.PI * (3 - Math.sqrt(5));
  const ay = TAU * t, ax = 0.4, pts = [];
  for (let i = 0; i < N; i++) {
    const y = 1 - 2 * (i + 0.5) / N, r = Math.sqrt(1 - y * y), th = ga * i;
    const wob = 1 + 0.06 * Math.sin(TAU * (t * 2 + i * 0.37));
    const x = Math.cos(th) * r * wob, z = Math.sin(th) * r * wob, yy = y * wob;
    const X = x * Math.cos(ay) + z * Math.sin(ay), Z0 = -x * Math.sin(ay) + z * Math.cos(ay);
    const Y = yy * Math.cos(ax) - Z0 * Math.sin(ax), Z = yy * Math.sin(ax) + Z0 * Math.cos(ax);
    pts.push([W / 2 + X * R, H / 2 + Y * R, Z, X, Y]);
  }
  c.lineWidth = Math.max(1, H / 900); c.strokeStyle = P.fg;
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    const a = pts[i], b = pts[j];
    const d = Math.hypot(a[3] - b[3], a[4] - b[4], a[2] - b[2]);
    if (d < 0.36) {
      c.globalAlpha = Math.min(1, (1 - d / 0.36) * (0.25 + 0.9 * (1 - (a[2] + b[2] + 2) / 4)));
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
    }
  }
  c.fillStyle = P.accent;
  pts.forEach(p => { const f = 1 - (p[2] + 1) / 2; c.globalAlpha = 0.3 + 0.7 * f; c.beginPath(); c.arc(p[0], p[1], H / 260 * (0.6 + f), 0, TAU); c.fill(); });
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
