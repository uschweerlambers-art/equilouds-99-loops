<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topo Map · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfb; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Topo Map (24) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#fbfbfb', fg: '#151419', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const nx = 96, ny = 54, dx = W / (nx - 1), dy = H / (ny - 1), F = new Float32Array(nx * ny);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const u = i / (ny - 1), v = j / (ny - 1);
    F[j * nx + i] = Math.sin(u * 3.1 + Math.sin(TAU * t) * 0.6) * Math.cos(v * 2.7 - 0.4)
      + 0.6 * Math.sin(u * 5.3 + v * 4.1 + TAU * t) + 0.35 * Math.cos(u * 9.1 - v * 7.3 - TAU * t * 2)
      + 0.9 * Math.exp(-(Math.pow(u - 0.9 - 0.25 * Math.cos(TAU * t), 2) + Math.pow(v - 0.5 - 0.15 * Math.sin(TAU * t), 2)) * 6);
  }
  const MS = [[], [[3, 0]], [[0, 1]], [[3, 1]], [[1, 2]], [[3, 0], [1, 2]], [[0, 2]], [[3, 2]], [[2, 3]], [[0, 2]], [[0, 1], [2, 3]], [[1, 2]], [[1, 3]], [[0, 1]], [[3, 0]], []];
  const levels = 15, lo = -1.6, hi = 2.3;
  c.lineJoin = 'round';
  for (let L = 0; L < levels; L++) {
    const iso = lo + (hi - lo) * (L + 0.5) / levels, major = L % 5 === 4;
    c.strokeStyle = major ? P.accent : P.fg; c.globalAlpha = major ? 1 : 0.5;
    c.lineWidth = (major ? 2.2 : 1) * Math.max(1, H / 900);
    c.beginPath();
    for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
      const a = F[j * nx + i], b = F[j * nx + i + 1], q = F[(j + 1) * nx + i + 1], d = F[(j + 1) * nx + i];
      const code = (a > iso) | (b > iso) << 1 | (q > iso) << 2 | (d > iso) << 3;
      if (code === 0 || code === 15) continue;
      const x = i * dx, y = j * dy;
      const e = [[x + dx * (iso - a) / (b - a), y], [x + dx, y + dy * (iso - b) / (q - b)], [x + dx * (iso - d) / (q - d), y + dy], [x, y + dy * (iso - a) / (d - a)]];
      for (const [p, r] of MS[code]) { c.moveTo(e[p][0], e[p][1]); c.lineTo(e[r][0], e[r][1]); }
    }
    c.stroke();
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
