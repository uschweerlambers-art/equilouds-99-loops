<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blob Morph · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #f56e0f; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Blob Morph (69) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#f56e0f', fg: '#151419', accent: '#fbfbfb' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  for (let L = 0; L < 3; L++) {
    const R = H * (0.32 - L * 0.08);
    c.beginPath();
    for (let a = 0; a <= 200; a++) {
      const th = TAU * a / 200;
      const r = R * (1 + 0.12 * Math.sin(3 * th + TAU * t + L) + 0.08 * Math.sin(5 * th - TAU * t * 2 + L * 2) + 0.05 * Math.sin(2 * th + TAU * t * 3));
      c.lineTo(W / 2 + r * Math.cos(th), H / 2 + r * Math.sin(th));
    }
    c.closePath();
    c.fillStyle = L === 0 ? P.fg : L === 1 ? P.accent : P.bg;
    c.fill();
  }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
