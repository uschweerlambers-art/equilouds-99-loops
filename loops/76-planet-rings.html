<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planet Rings · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Planet Rings (76) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, R = H * 0.19, tilt = -0.32, e = 0.27;
  const rnd = s => { const h = Math.sin(s) * 43758.5453; return h - Math.floor(h); };
  c.fillStyle = P.fg;
  for (let i = 0; i < 80; i++) { c.globalAlpha = 0.2 + 0.6 * (0.5 + 0.5 * Math.sin(TAU * (t * 2 + rnd(i * 3.1)))); c.fillRect(rnd(i * 1.7) * W, rnd(i * 2.3) * H, H / 400, H / 400); }
  const ring = front => {
    for (let k = 0; k < 7; k++) {
      const rr = R * (1.45 + k * 0.1);
      c.strokeStyle = k === 2 ? P.accent : P.fg; c.globalAlpha = k === 2 ? 0.95 : 0.3 + 0.07 * k; c.lineWidth = H * 0.008;
      c.beginPath(); c.ellipse(cx, cy, rr, rr * e, tilt, front ? 0 : Math.PI, front ? Math.PI : TAU); c.stroke();
    }
  };
  const ma = TAU * t * 2, mx = cx + Math.cos(ma) * R * 2.6, my = cy + Math.sin(ma) * R * 0.6 - R * 0.2, mFront = Math.sin(ma) > 0;
  const moon = () => { c.globalAlpha = 1; c.fillStyle = P.fg; c.beginPath(); c.arc(mx, my, R * 0.16, 0, TAU); c.fill(); };
  if (!mFront) moon();
  ring(false);
  c.globalAlpha = 1; c.fillStyle = P.fg; c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fill();
  c.save(); c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.clip();
  c.fillStyle = P.bg; c.globalAlpha = 0.12;
  for (let k = -3; k <= 3; k++) c.fillRect(cx - R, cy + k * R * 0.28 - R * 0.05, R * 2, R * 0.1);
  for (let k = 0; k < 2; k++) { const u = (t + k * 0.5) % 1; c.globalAlpha = 0.9; c.fillStyle = P.accent; c.beginPath(); c.ellipse(cx - R * 1.3 + u * R * 2.6, cy + (k ? 0.35 : -0.25) * R, R * 0.14, R * 0.06, 0, 0, TAU); c.fill(); }
  c.globalAlpha = 0.45; c.fillStyle = P.bg; c.beginPath(); c.arc(cx + R * 0.45, cy + R * 0.2, R * 1.05, 0, TAU); c.fill();
  c.restore();
  ring(true);
  if (mFront) moon();
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
