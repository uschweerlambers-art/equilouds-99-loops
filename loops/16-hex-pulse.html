<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex Pulse · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Hex Pulse (16) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const r = H / 14, w = Math.sqrt(3) * r;
  const cols = Math.ceil(W / w) + 2, rows = Math.ceil(H / (r * 1.5)) + 2;
  for (let j = -1; j < rows; j++) {
    for (let i = -1; i < cols; i++) {
      const x = i * w + (j % 2 ? w / 2 : 0), y = j * r * 1.5;
      const d = Math.hypot(x - W / 2, y - H / 2) / H;
      const k = 0.5 + 0.5 * Math.sin(TAU * t * 2 - d * 9);
      const s = r * (0.25 + 0.68 * k);
      c.beginPath();
      for (let a = 0; a < 6; a++) {
        const ang = TAU * a / 6 + Math.PI / 6;
        c.lineTo(x + s * Math.cos(ang), y + s * Math.sin(ang));
      }
      c.closePath();
      c.fillStyle = k > 0.82 ? P.accent : P.fg;
      c.globalAlpha = 0.2 + 0.8 * k;
      c.fill();
    }
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
