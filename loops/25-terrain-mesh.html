<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain Mesh · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Terrain Mesh (25) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const M = 24, cols = 40, R = 22, scroll = t * M, base = Math.floor(scroll);
  const hgt = (i, n) => { const u = i / cols, v = n / M; return (0.25 + Math.abs(u - 0.5) * 2.2) * (0.5 * Math.sin(TAU * (u * 2 + v)) * Math.sin(TAU * v * 2 + u * 4) + 0.3 * Math.cos(TAU * (u * 3 - v * 3))); };
  const proj = (i, z, h) => [W / 2 + (i / cols - 0.5) * 16 / z * W * 0.12, H * 0.36 + (1.6 - h) / z * H * 0.3];
  c.lineWidth = Math.max(1, H / 800); c.lineJoin = 'round';
  let prev = null;
  for (let n = base + R; n >= base + 1; n--) {
    const z = n - scroll + 0.6;
    const row = []; for (let i = 0; i <= cols; i++) row.push(proj(i, z, hgt(i, n)));
    const a = Math.min(1, 2.2 / z) * Math.max(0, Math.min(1, R + 0.6 - z));
    c.globalAlpha = a; c.strokeStyle = n % 6 === 0 ? P.accent : P.fg;
    c.beginPath(); row.forEach(p => c.lineTo(p[0], p[1])); c.stroke();
    if (prev) { c.strokeStyle = P.fg; c.globalAlpha = a * 0.6; c.beginPath(); for (let i = 0; i <= cols; i += 2) { c.moveTo(prev[i][0], prev[i][1]); c.lineTo(row[i][0], row[i][1]); } c.stroke(); }
    prev = row;
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
