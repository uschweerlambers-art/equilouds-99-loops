<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contour Drift · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Contour Drift (22) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  c.lineWidth = H / 360;
  const R = Math.hypot(W, H) / 2, n = 28;
  for (let i = 0; i < n; i++) {
    const base = ((i + t * 7) % n) / n * R;
    c.beginPath();
    for (let a = 0; a <= 140; a++) {
      const th = TAU * a / 140;
      const wob = 1 + 0.09 * Math.sin(3 * th + TAU * t) + 0.05 * Math.sin(5 * th - TAU * t * 2);
      c.lineTo(W / 2 + base * wob * Math.cos(th), H / 2 + base * wob * Math.sin(th));
    }
    c.globalAlpha = Math.min(1, base / R * 3);
    c.strokeStyle = i % 7 === 0 ? P.accent : P.fg;
    c.stroke();
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
