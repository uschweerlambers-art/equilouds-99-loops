<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Division · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Cell Division (70) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  const img = c.createImageData(W, H), d = img.data;
  const hx = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));
  const B = hx(P.bg), F = hx(P.fg);
  const cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const d1 = 0.5 - 0.5 * Math.cos(TAU * t), d2 = Math.max(0, Math.sin(Math.PI * t * 2 - Math.PI * 0.4)) * d1;
  const r = H * 0.15, sx = H * 0.2 * d1, sy = H * 0.2 * d2, r2 = r * r;
  const balls = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => [W / 2 + a * sx, H / 2 + b * sy]);
  const mw = Math.max(1.5, H * 0.014);            // Membranstärke in Pixeln
  const field = (x, y, out) => {
    let s = 0, gx = 0, gy = 0;
    for (let k = 0; k < 4; k++) { const dx = x - balls[k][0], dy = y - balls[k][1], q = dx * dx + dy * dy + 1, v = r2 / q; s += v; const f = 2 * v / q; gx -= f * dx; gy -= f * dy; }
    out[0] = s; out[1] = gx; out[2] = gy;
  };
  const shade = (dist, o, out = d) => {           // dist: Abstand zur Zellwand in Pixeln, innen positiv
    const outer = cl(0.5 + dist), inner = cl(0.5 + dist - mw), mem = outer - inner, inside = inner * 0.12;
    for (let k = 0; k < 3; k++) { const base = B[k] + (F[k] - B[k]) * inside; out[o + k] = base + (F[k] - base) * mem; }
    out[o + 3] = 255;
  };
  const tmp = new Uint8ClampedArray(4);
  const f0 = [0, 0, 0], f1 = [0, 0, 0], S = 4;
  for (let y0 = 0; y0 < H; y0 += S) for (let x0 = 0; x0 < W; x0 += S) {
    const cx = x0 + S / 2 - 0.5, cy = y0 + S / 2 - 0.5;
    field(cx, cy, f0);
    const gl0 = Math.hypot(f0[1], f0[2]) + 1e-9, dist0 = (f0[0] - 1) / gl0;
    const near = dist0 > -S * 1.5 && dist0 < mw + S * 1.5;
    if (!near) shade(dist0, 0, tmp);              // außerhalb der Wand ist die Farbe im Block konstant
    for (let y = y0; y < Math.min(H, y0 + S); y++) for (let x = x0; x < Math.min(W, x0 + S); x++) {
      const o = (y * W + x) * 4;
      if (near) { field(x, y, f1); shade((f1[0] - 1) / (Math.hypot(f1[1], f1[2]) + 1e-9), o); }
      else { d[o] = tmp[0]; d[o + 1] = tmp[1]; d[o + 2] = tmp[2]; d[o + 3] = 255; }
    }
  }
  c.putImageData(img, 0, 0);
  c.fillStyle = P.accent;
  balls.forEach(([bx, by]) => { c.beginPath(); c.arc(bx, by, H * 0.035, 0, TAU); c.fill(); });
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
