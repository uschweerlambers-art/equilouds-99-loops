<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Division · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Cell Division (70) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  const w = Math.max(2, Math.floor(W / 4)), h = Math.max(2, Math.floor(H / 4));
  const img = c.createImageData(w, h), d = img.data;
  const hx = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));
  const B = hx(P.bg), F = hx(P.fg);
  const cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const d1 = 0.5 - 0.5 * Math.cos(TAU * t), d2 = Math.max(0, Math.sin(Math.PI * t * 2 - Math.PI * 0.4)) * d1;
  const r = h * 0.15, sx = h * 0.2 * d1, sy = h * 0.2 * d2;
  const balls = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => [w / 2 + a * sx, h / 2 + b * sy]);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0; for (const [bx, by] of balls) s += r * r / ((x - bx) * (x - bx) + (y - by) * (y - by) + 1);
    const mem = cl((s - 1) / 0.12) * (1 - cl((s - 1.35) / 0.15)), inside = cl((s - 1) / 0.1) * 0.12;
    const o = (y * w + x) * 4;
    for (let k = 0; k < 3; k++) { const base = B[k] + (F[k] - B[k]) * inside; d[o + k] = base + (F[k] - base) * mem; }
    d[o + 3] = 255;
  }
  c.putImageData(img, 0, 0);
  c.imageSmoothingEnabled = true;
  c.drawImage(c.canvas, 0, 0, w, h, 0, 0, W, H);
  c.fillStyle = P.accent;
  balls.forEach(([bx, by]) => { c.beginPath(); c.arc(bx * W / w, by * H / h, H * 0.035, 0, TAU); c.fill(); });
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
