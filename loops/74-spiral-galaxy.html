<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiral Galaxy · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Spiral Galaxy (74) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const N = 900, arms = 3, R = Math.hypot(W, H) * 0.55;
  for (let i = 0; i < N; i++) {
    const h1 = Math.sin(i * 12.9898) * 43758.5453, r1 = h1 - Math.floor(h1);
    const h2 = Math.sin(i * 78.233) * 12543.123, r2 = h2 - Math.floor(h2);
    const d = Math.pow(r1, 0.7);
    const ang = (i % arms) * TAU / arms + d * 5 + (r2 - 0.5) * 0.6 + TAU * t;
    const rr = d * R * 0.6;
    const x = W / 2 + Math.cos(ang) * rr, y = H / 2 + Math.sin(ang) * rr * 0.6;
    const tw = 0.5 + 0.5 * Math.sin(TAU * (t * 3 + r2));
    const sz = H / 400 * (1 + 2 * tw * (1 - d));
    c.globalAlpha = 0.3 + 0.7 * tw * (1 - d * 0.6);
    c.fillStyle = r2 > 0.93 ? P.accent : P.fg;
    c.fillRect(x - sz / 2, y - sz / 2, sz, sz);
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
