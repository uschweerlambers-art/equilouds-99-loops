<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Press · Equilouds 99 Loops</title>
<style>
  /* 3D Press (89) · Equilouds 99 Loops · uweschweerlambers.de · License: MIT, free to use, commercial use included */
  :root { --bg: #fbfbfb; --fg: #151419; --accent: #f56e0f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font-size: 18px; }

.btn-press { padding: .9em 1.9em; border: 0; border-radius: .6em; background: var(--accent); color: var(--bg); font: 700 1em/1 system-ui, sans-serif; cursor: pointer; box-shadow: 0 .35em 0 color-mix(in srgb, var(--accent) 55%, #000), 0 .7em 1em rgba(0,0,0,.2); animation: bob 2.4s ease-in-out infinite; transition: transform .1s, box-shadow .1s; }
.btn-press:hover { animation: none; transform: translateY(-.1em); }
.btn-press:active { transform: translateY(.3em); box-shadow: 0 .05em 0 color-mix(in srgb, var(--accent) 55%, #000), 0 .15em .3em rgba(0,0,0,.2); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.18em); } }
</style>
</head>
<body>
  <button class="btn-press">Download</button>
</body>
</html>
