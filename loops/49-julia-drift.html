<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julia Drift · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Julia Drift (49) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  const w = Math.max(2, Math.floor(W / 4)), h = Math.max(2, Math.floor(H / 4));
  const img = c.createImageData(w, h), d = img.data;
  const hx = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));
  const B = hx(P.bg), F = hx(P.fg), A = hx(P.accent);
  const a = TAU * t, cr = 0.7885 * Math.cos(a), ci = 0.7885 * Math.sin(a);
  const maxIt = 48, sc = 3.4 / w;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let zr = (x - w / 2) * sc, zi = (y - h / 2) * sc, n = 0;
    while (n < maxIt && zr * zr + zi * zi < 4) { const tmp = zr * zr - zi * zi + cr; zi = 2 * zr * zi + ci; zr = tmp; n++; }
    const v = Math.pow(n / maxIt, 0.8), o = (y * w + x) * 4;
    const col = v < 0.6 ? B.map((b, k) => b + (A[k] - b) * v / 0.6) : A.map((q, k) => q + (F[k] - q) * (v - 0.6) / 0.4);
    d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
  }
  c.putImageData(img, 0, 0);
  c.imageSmoothingEnabled = true;
  c.drawImage(c.canvas, 0, 0, w, h, 0, 0, W, H);
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
