<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Wave · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Pixel Wave (20) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const s = H / 18, gap = s * 0.12;
  for (let j = 0; j * s < H; j++) for (let i = 0; i * s < W; i++) {
    const u = i * s / W, v = j * s / H;
    const n = Math.sin(TAU * (u * 1.2 + t)) + Math.sin(TAU * (v * 1.5 - t * 2) + u * 3) + Math.sin(TAU * ((u + v) * 0.7 + t * 3));
    if (n > 0.6) {
      c.fillStyle = n > 1.8 ? P.accent : P.fg; c.globalAlpha = Math.min(1, (n - 0.6) * 1.2);
      c.fillRect(i * s + gap, j * s + gap, s - gap * 2, s - gap * 2);
    } else {
      c.globalAlpha = 0.12; c.fillStyle = P.fg;
      c.fillRect(i * s + s / 2 - gap, j * s + s / 2 - gap, gap * 2, gap * 2);
    }
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
