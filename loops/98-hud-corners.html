<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUD Corners · Equilouds 99 Loops</title>
<style>
  /* HUD Corners (98) · Equilouds 99 Loops · uweschweerlambers.de · License: MIT, free to use, commercial use included */
  :root { --bg: #151419; --fg: #fbfbfb; --accent: #f56e0f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font-size: 18px; }

.btn-hud { position: relative; padding: 1em 2.2em; border: 0; background: color-mix(in srgb, var(--accent) 7%, transparent); color: var(--fg); font: 600 .95em/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; --c: .7em; }
.btn-hud::before, .btn-hud::after { content: ""; position: absolute; width: var(--c); height: var(--c); border: 2px solid var(--accent); transition: width .35s, height .35s; animation: hud 2.4s ease-in-out infinite; }
.btn-hud::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
.btn-hud::after { bottom: 0; right: 0; border-left: 0; border-top: 0; }
.btn-hud:hover::before, .btn-hud:hover::after { width: 100%; height: 100%; animation: none; }
@keyframes hud { 50% { width: calc(var(--c) * 1.7); height: calc(var(--c) * 1.7); } }
</style>
</head>
<body>
  <button class="btn-hud">Launch system</button>
</body>
</html>
