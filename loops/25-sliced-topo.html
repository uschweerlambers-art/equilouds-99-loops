<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sliced Topo · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #f56e0f; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Sliced Topo (25) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#f56e0f', fg: '#151419', accent: '#fbfbfb' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2, ph = t % 1;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  // Quadratischer Geländeblock aus dünnen Scheiben in Isometrie. Das Relief verwandelt sich ständig:
  // Gipfel wachsen und sinken, ein flaches Tal zieht hindurch. Weiße Flächen, schwarze Kanten.
  const NS = 22, NX = 90, size = 26, step = size / NS, th = step * 0.5, base = 2.2;
  const face = P.accent, edge = P.fg;            // Palette O: Grund orange, Flächen weiß, Linien schwarz
  const hgt = (x, y) => {
    const u = x / size, v = y / size;
    let n = Math.sin(TAU * (u * 1.6 + ph)) * Math.cos(TAU * (v * 1.3 - ph))
      + 0.7 * Math.sin(TAU * (u * 2.7 - v * 1.9 + 2 * ph) + 1)
      + 0.5 * Math.cos(TAU * (v * 3.1 + u * 0.8 - ph) + 2)
      + 0.35 * Math.sin(TAU * (u * 5 + v * 4 + 3 * ph));
    const valley = Math.exp(-Math.pow((u + v - 1 - 0.6 * Math.sin(TAU * ph)) * 3.2, 2));   // wanderndes Tal
    n = n * (1 - 0.85 * valley);
    const edgeFade = Math.min(1, u * 8, (1 - u) * 8);
    return 1.2 + Math.max(0, 2.6 + 3.2 * n) * edgeFade * 0.9;
  };
  const s = H / 40, C = Math.cos(Math.PI / 6);
  const raw = (x, y, z) => [(x - y) * C, (x + y) * 0.5 - z];
  const ctr = raw(size / 2, size / 2, 2.5);
  const iso = (x, y, z) => { const q = raw(x, y, z); return [W / 2 + (q[0] - ctr[0]) * s, H / 2 + (q[1] - ctr[1]) * s]; };
  const lw = Math.max(1, H / 420);
  const poly = (pts, fill, stroke) => { c.beginPath(); pts.forEach((p, i) => { const q = iso(p[0], p[1], p[2]); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }); c.closePath(); c.fillStyle = fill; c.fill(); if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } };
  c.lineJoin = 'round';
  // massiver Sockel
  poly([[0, 0, -base], [size, 0, -base], [size, 0, 0], [0, 0, 0]], face, edge);
  poly([[0, size, -base], [size, size, -base], [size, size, 0], [0, size, 0]], face, edge);
  poly([[size, 0, -base], [size, size, -base], [size, size, 0], [size, 0, 0]], face, edge);
  poly([[0, 0, 0], [size, 0, 0], [size, size, 0], [0, size, 0]], face, edge);
  for (let j = 0; j < NS; j++) {
    const y0 = j * step + (step - th) / 2, y1 = y0 + th;
    const prof = []; for (let i = 0; i <= NX; i++) { const x = size * i / NX; prof.push([x, hgt(x, (y0 + y1) / 2)]); }
    for (let i = 0; i < NX; i++) { const [xa, za] = prof[i], [xb, zb] = prof[i + 1]; poly([[xa, y0, za], [xb, y0, zb], [xb, y1, zb], [xa, y1, za]], face); }
    c.beginPath(); prof.forEach(([x, z], i) => { const q = iso(x, y0, z); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }); c.strokeStyle = edge; c.lineWidth = lw; c.stroke();
    const ze = prof[NX][1];
    poly([[size, y0, -base], [size, y1, -base], [size, y1, ze], [size, y0, ze]], face, edge);
    poly([[0, y1, -base]].concat(prof.map(([x, z]) => [x, y1, z])).concat([[size, y1, -base]]), face, edge);
  }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
