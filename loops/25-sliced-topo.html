<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sliced Topo · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #f56e0f; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Sliced Topo (25) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#f56e0f', fg: '#151419', accent: '#fbfbfb' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2, ph = t % 1;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  // Ein Geländeblock aus dünnen, senkrechten Scheiben in Isometrie. Hügel wandern langsam durch das Gelände.
  const NS = 18, NX = 80, th = 0.5, step = 1.3, len = NS * step, wid = 26;
  const hgt = (x, y) => {
    const u = x / wid, v = y / len;
    let h = 2.2 + 1.6 * Math.sin(TAU * (u * 1.2 + ph)) * Math.cos(TAU * (v * 0.7 - ph))
      + 2.4 * Math.exp(-((u - 0.25 - 0.08 * Math.sin(TAU * ph)) ** 2 + (v - 0.35) ** 2) / 0.03)
      + 1.8 * Math.exp(-((u - 0.75) ** 2 + (v - 0.7 - 0.08 * Math.cos(TAU * ph)) ** 2) / 0.025)
      + 0.5 * Math.sin(TAU * (u * 3 - ph * 2) + v * 4);
    return Math.max(0.8, h * 1.6);
  };
  const s = H / 32, C = Math.cos(Math.PI / 6);
  const raw = (x, y, z) => [(x - y) * C, (x + y) * 0.5 - z];
  const ctr = raw(wid / 2, len / 2, 3);
  const iso = (x, y, z) => { const q = raw(x, y, z); return [W / 2 + (q[0] - ctr[0]) * s, H / 2 + (q[1] - ctr[1]) * s]; };
  const poly = (pts, fill, stroke, lw) => { c.beginPath(); pts.forEach((p, i) => { const q = iso(p[0], p[1], p[2]); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }); c.closePath(); c.fillStyle = fill; c.fill(); c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); };
  const lw = Math.max(1, H / 480);
  c.lineJoin = 'round';
  // Grundplatte
  poly([[0, 0, 0], [wid, 0, 0], [wid, len, 0], [0, len, 0]], P.bg, P.fg, lw);
  for (let j = 0; j < NS; j++) {
    const y0 = j * step, y1 = y0 + th, hot = j === Math.floor(NS / 2);
    const col = hot ? P.accent : P.fg;
    const prof = []; for (let i = 0; i <= NX; i++) { const x = wid * i / NX; prof.push([x, hgt(x, y0 + th / 2)]); }
    // Oberseite der Scheibe: schmaler Streifen entlang des Profils
    for (let i = 0; i < NX; i++) {
      const [xa, za] = prof[i], [xb, zb] = prof[i + 1];
      poly([[xa, y0, za], [xb, y0, zb], [xb, y1, zb], [xa, y1, za]], P.bg, P.bg, lw * 0.6);
    }
    c.beginPath(); prof.forEach(([x, z], i) => { const q = iso(x, y0, z); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }); c.strokeStyle = col; c.lineWidth = lw; c.stroke();
    // rechte Stirnseite
    const ze = prof[NX][1];
    poly([[wid, y0, 0], [wid, y1, 0], [wid, y1, ze], [wid, y0, ze]], P.bg, col, lw);
    // Vorderseite (zur Kamera) mit Profilkante
    const front = [[0, y1, 0]].concat(prof.map(([x, z]) => [x, y1, z])).concat([[wid, y1, 0]]);
    poly(front, P.bg, col, lw);
  }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
