<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metaballs · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Metaballs (68) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  const w = Math.max(2, Math.floor(W / 4)), h = Math.max(2, Math.floor(H / 4));
  const img = c.createImageData(w, h), d = img.data;
  const hx = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));
  const B = hx(P.bg), F = hx(P.fg), A = hx(P.accent);
  const cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const balls = [];
  for (let k = 0; k < 7; k++) balls.push([w * (0.5 + 0.36 * Math.sin(TAU * (t * (1 + k % 3) + k * 0.31))), h * (0.5 + 0.34 * Math.cos(TAU * (t * (1 + (k + 1) % 2) + k * 0.53))), Math.pow(h * (0.1 + 0.03 * (k % 3)), 2)]);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0; for (const [bx, by, r2] of balls) s += r2 / ((x - bx) * (x - bx) + (y - by) * (y - by) + 1);
    const g = cl((s - 0.55) / 0.45) * 0.18, e1 = cl((s - 1) / 0.08), e2 = cl((s - 1.7) / 0.12);
    const o = (y * w + x) * 4;
    for (let k = 0; k < 3; k++) { const base = B[k] + (F[k] - B[k]) * g; const m1 = base + (F[k] - base) * e1; d[o + k] = m1 + (A[k] - m1) * e2; }
    d[o + 3] = 255;
  }
  c.putImageData(img, 0, 0);
  c.imageSmoothingEnabled = true;
  c.drawImage(c.canvas, 0, 0, w, h, 0, 0, W, H);
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
