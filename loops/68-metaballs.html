<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metaballs · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Metaballs (68) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  // Volle Auflösung mit glatten Kanten: Abstand zur Isolinie = (Feld - Schwelle) / Gradient.
  // Tempo: Pro 4x4-Block wird das Feld einmal exakt berechnet; nur Blöcke an einer Kante rechnen pixelgenau.
  const img = c.createImageData(W, H), d = img.data;
  const hx = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));
  const B = hx(P.bg), F = hx(P.fg), A = hx(P.accent);
  const cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const bx = [], by = [], br = [];
  for (let k = 0; k < 7; k++) { bx.push(W * (0.5 + 0.36 * Math.sin(TAU * (t * (1 + k % 3) + k * 0.31)))); by.push(H * (0.5 + 0.34 * Math.cos(TAU * (t * (1 + (k + 1) % 2) + k * 0.53)))); br.push(Math.pow(H * (0.1 + 0.03 * (k % 3)), 2)); }
  const field = (x, y, out) => {
    let s = 0, gx = 0, gy = 0;
    for (let k = 0; k < 7; k++) { const dx = x - bx[k], dy = y - by[k], q = dx * dx + dy * dy + 1, v = br[k] / q; s += v; const f = 2 * v / q; gx -= f * dx; gy -= f * dy; }
    out[0] = s; out[1] = gx; out[2] = gy;
  };
  const shade = (s, gl, o, out = d) => {
    const glow = cl((s - 0.45) / 0.55) * 0.16, e1 = cl(0.5 + (s - 1) / gl), e2 = cl(0.5 + (s - 1.7) / gl);
    for (let k = 0; k < 3; k++) { const base = B[k] + (F[k] - B[k]) * glow; const m1 = base + (F[k] - base) * e1; out[o + k] = m1 + (A[k] - m1) * e2; }
    out[o + 3] = 255;
  };
  const tmp = new Uint8ClampedArray(4);
  const f0 = [0, 0, 0], f1 = [0, 0, 0], S = 4;
  for (let y0 = 0; y0 < H; y0 += S) for (let x0 = 0; x0 < W; x0 += S) {
    const cx = x0 + S / 2 - 0.5, cy = y0 + S / 2 - 0.5;
    field(cx, cy, f0);
    const gl0 = Math.hypot(f0[1], f0[2]) + 1e-9;
    const near = Math.abs(f0[0] - 1) / gl0 < S * 1.5 || Math.abs(f0[0] - 1.7) / gl0 < S * 1.5;
    const flat = !near && (f0[0] + gl0 * S < 0.45 || f0[0] - gl0 * S > 1.7);   // reiner Hintergrund oder voller Kern
    if (flat) shade(f0[0], gl0, 0, tmp);
    for (let y = y0; y < Math.min(H, y0 + S); y++) for (let x = x0; x < Math.min(W, x0 + S); x++) {
      const o = (y * W + x) * 4;
      if (flat) { d[o] = tmp[0]; d[o + 1] = tmp[1]; d[o + 2] = tmp[2]; d[o + 3] = 255; }
      else if (near) { field(x, y, f1); shade(f1[0], Math.hypot(f1[1], f1[2]) + 1e-9, o); }
      else shade(f0[0] + f0[1] * (x - cx) + f0[2] * (y - cy), gl0, o);
    }
  }
  c.putImageData(img, 0, 0);
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
