<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contour Island · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfb; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Contour Island (26) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#fbfbfb', fg: '#151419', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const n = 64, S = H * 0.9, ox = (W - S) / 2, oy = (H - S) / 2, dd = S / (n - 1), F = new Float32Array(n * n);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const x = i / (n - 1) * 2 - 1, y = j / (n - 1) * 2 - 1, th = Math.atan2(y, x), r2 = x * x + y * y;
    F[j * n + i] = Math.exp(-r2 * 2.2 * (1 + 0.22 * Math.sin(3 * th + TAU * t) + 0.12 * Math.sin(5 * th - TAU * t * 2))) + 0.25 * Math.exp(-((x - 0.35 * Math.cos(TAU * t)) ** 2 + (y + 0.3) ** 2) * 14);
  }
  const MS = [[], [[3, 0]], [[0, 1]], [[3, 1]], [[1, 2]], [[3, 0], [1, 2]], [[0, 2]], [[3, 2]], [[2, 3]], [[0, 2]], [[0, 1], [2, 3]], [[1, 2]], [[1, 3]], [[0, 1]], [[3, 0]], []];
  c.lineJoin = 'round';
  for (let L = 0; L < 11; L++) {
    const iso = 0.06 + L * 0.09, major = L % 3 === 0;
    c.strokeStyle = major ? P.accent : P.fg; c.globalAlpha = major ? 1 : 0.6; c.lineWidth = (major ? 2 : 1) * Math.max(1, H / 700);
    c.beginPath();
    for (let j = 0; j < n - 1; j++) for (let i = 0; i < n - 1; i++) {
      const a = F[j * n + i], b = F[j * n + i + 1], q = F[(j + 1) * n + i + 1], d = F[(j + 1) * n + i];
      const code = (a > iso) | (b > iso) << 1 | (q > iso) << 2 | (d > iso) << 3;
      if (code === 0 || code === 15) continue;
      const x = ox + i * dd, y = oy + j * dd;
      const e = [[x + dd * (iso - a) / (b - a), y], [x + dd, y + dd * (iso - b) / (q - b)], [x + dd * (iso - d) / (q - d), y + dd], [x, y + dd * (iso - a) / (d - a)]];
      for (const [p, r] of MS[code]) { c.moveTo(e[p][0], e[p][1]); c.lineTo(e[r][0], e[r][1]); }
    }
    c.stroke();
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
