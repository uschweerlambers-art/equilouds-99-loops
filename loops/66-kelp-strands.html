<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelp Strands · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Kelp Strands (66) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const n = 26, rnd = s => { const h = Math.sin(s) * 43758.5453; return h - Math.floor(h); };
  c.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x0 = W * (i + 0.5) / n + (rnd(i + 1) - 0.5) * W / n, len = H * (0.45 + 0.5 * rnd(i * 3.3)), ph = rnd(i * 7.1);
    const col = i % 5 === 0 ? P.accent : P.fg;
    c.strokeStyle = col; c.fillStyle = col; c.globalAlpha = 0.4 + 0.6 * rnd(i * 5.5);
    let px = x0, py = H;
    for (let s = 1; s <= 24; s++) {
      const v = s / 24;
      const x = x0 + Math.sin(TAU * (t + ph) - v * 3) * W * 0.06 * v + Math.sin(TAU * (t * 2 + ph) - v * 6) * W * 0.008 * v;
      const y = H - len * v;
      c.lineWidth = H * 0.012 * (1 - v * 0.7);
      c.beginPath(); c.moveTo(px, py); c.lineTo(x, y); c.stroke();
      if (s % 4 === 0) {
        c.save(); c.translate(x, y); c.rotate((s % 8 ? 1 : -1) * 0.9 + Math.sin(TAU * (t + ph)) * 0.2 - Math.PI / 2);
        c.beginPath(); c.ellipse(H * 0.02, 0, H * 0.022 * (1 - v * 0.5), H * 0.007, 0, 0, TAU); c.fill(); c.restore();
      }
      px = x; py = y;
    }
  }
  c.strokeStyle = P.accent; c.lineWidth = Math.max(1, H / 600);
  for (let i = 0; i < 24; i++) {
    const y = H * 1.05 - ((rnd(i * 9.7) + t * (1 + i % 3)) % 1) * H * 1.15;
    const x = rnd(i * 4.4) * W + Math.sin(TAU * (t * 3 + rnd(i))) * H * 0.01;
    c.globalAlpha = 0.6; c.beginPath(); c.arc(x, y, H * (0.004 + 0.008 * rnd(i * 2.2)), 0, TAU); c.stroke();
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
