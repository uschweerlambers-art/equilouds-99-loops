<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plexus Hex · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Plexus Hex (04) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2, seg = TAU / 6;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const R = H * 0.4, N = 64, pts = [];
  const rnd = s => { const h = Math.sin(s) * 43758.5453; return h - Math.floor(h); };
  const edge = a => { const l = ((a % seg) + seg) % seg - seg / 2; return Math.cos(seg / 2) / Math.cos(l); };
  for (let i = 0; i < N; i++) {
    const r1 = rnd(i * 12.9 + 1), r2 = rnd(i * 78.2 + 1);
    const a = TAU * (r1 + t * (i % 2 ? 1 : -1)) + 0.4 * Math.sin(TAU * (t * 2 + r2));
    const rho = 0.12 + 0.82 * (0.5 + 0.5 * Math.sin(TAU * (t + r2)));
    const rr = R * rho * edge(a);
    pts.push([W / 2 + Math.cos(a) * rr, H / 2 + Math.sin(a) * rr]);
  }
  c.strokeStyle = P.accent; c.lineWidth = H / 260;
  c.beginPath(); for (let k = 0; k < 6; k++) { const a = seg * k; c.lineTo(W / 2 + Math.cos(a) * R * 1.04, H / 2 + Math.sin(a) * R * 1.04); } c.closePath(); c.stroke();
  const L = H * 0.17; c.strokeStyle = P.fg; c.lineWidth = Math.max(1, H / 800);
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]);
    if (d < L) { c.globalAlpha = 1 - d / L; c.beginPath(); c.moveTo(pts[i][0], pts[i][1]); c.lineTo(pts[j][0], pts[j][1]); c.stroke(); }
  }
  c.globalAlpha = 1; c.fillStyle = P.fg;
  pts.forEach(p => { c.beginPath(); c.arc(p[0], p[1], H / 220, 0, TAU); c.fill(); });
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
