<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide Puzzle · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Slide Puzzle (40) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2, ph = t % 1;
  const hx = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));
  const B = hx(P.bg), F = hx(P.fg);
  const mix = k => 'rgb(' + B.map((b, i) => Math.round(b + (F[i] - b) * k)).join(',') + ')';
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  // 24 zufällige Züge durcheinander, danach dieselben 24 Züge zurück: nach 12 s ist das Puzzle wieder gelöst
  const N = 4, STEPS = 24;
  let MOVES;
  {
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    let e = 15, last = -1; const moves = [];
    for (let i = 0; i < STEPS; i++) {
      const ex = e % N, ey = Math.floor(e / N), opts = [];
      if (ex > 0) opts.push(e - 1); if (ex < N - 1) opts.push(e + 1); if (ey > 0) opts.push(e - N); if (ey < N - 1) opts.push(e + N);
      const ok = opts.filter(o => o !== last), nxt = ok[Math.floor(rnd() * ok.length)];
      moves.push([nxt, e]); last = e; e = nxt;            // Kachel von nxt rutscht nach e
    }
    MOVES = moves.concat(moves.slice().reverse().map(([a, b]) => [b, a]));
  }
  const moves = MOVES, total = moves.length;
  const u = ph * total, step = Math.floor(u), f = u - step;
  const board = []; for (let i = 0; i < 15; i++) board.push(i); board.push(-1);
  for (let i = 0; i < step; i++) { const [from, to] = moves[i]; board[to] = board[from]; board[from] = -1; }
  const [mFrom, mTo] = moves[step];
  const ease = f < 0.7 ? (1 - Math.cos(Math.PI * f / 0.7)) / 2 : 1;
  const size = H * 0.78, cell = size / N, gap = cell * 0.07, x0 = (W - size) / 2, y0 = (H - size) / 2;
  const rr = cell * 0.12;
  c.fillStyle = mix(0.06); c.beginPath(); c.roundRect ? c.roundRect(x0 - gap, y0 - gap, size + gap, size + gap, rr * 1.5) : c.rect(x0 - gap, y0 - gap, size + gap, size + gap); c.fill();
  c.font = '600 ' + Math.round(cell * 0.36) + 'px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let i = 0; i < 16; i++) {
    const id = board[i]; if (id < 0) continue;
    let gx = i % N, gy = Math.floor(i / N), moving = false;
    if (i === mFrom) { gx += ((mTo % N) - gx) * ease; gy += (Math.floor(mTo / N) - gy) * ease; moving = true; }
    const x = x0 + gx * cell, y = y0 + gy * cell, home = id === i && !moving;
    c.fillStyle = moving ? P.accent : home ? P.fg : mix(0.62);
    c.beginPath(); c.roundRect ? c.roundRect(x, y, cell - gap, cell - gap, rr) : c.rect(x, y, cell - gap, cell - gap); c.fill();
    c.fillStyle = P.bg; c.fillText(String(id + 1), x + (cell - gap) / 2, y + (cell - gap) / 2 + cell * 0.02);
  }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
