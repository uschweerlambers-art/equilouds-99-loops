<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendulum Wave · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Pendulum Wave (58) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const n = 15, top = H * 0.12, cx = W / 2;
  const gap = (H * 0.76) / (n - 1), A = Math.min(W, H) * 0.42;
  const pts = [];
  c.lineWidth = Math.max(1, H / 700); c.strokeStyle = P.fg; c.globalAlpha = 0.18;
  for (let i = 0; i < n; i++) {
    const y = top + i * gap;
    c.beginPath(); c.moveTo(cx - A, y); c.lineTo(cx + A, y); c.stroke();
    pts.push([cx + A * Math.sin(TAU * t * (4 + i)), y]);
  }
  c.globalAlpha = 0.9; c.strokeStyle = P.accent; c.lineWidth = H / 420;
  c.beginPath(); pts.forEach(([x, y]) => c.lineTo(x, y)); c.stroke();
  c.globalAlpha = 1; c.fillStyle = P.fg;
  pts.forEach(([x, y]) => { c.beginPath(); c.arc(x, y, H / 70, 0, TAU); c.fill(); });
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
