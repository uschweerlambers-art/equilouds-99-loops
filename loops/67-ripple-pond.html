<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple Pond · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Ripple Pond (67) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const n = 6, Rmax = H * 0.46;
  for (let i = 0; i < n; i++) {
    const p = (t * 2 + i / n) % 1;
    c.strokeStyle = i % 3 === 0 ? P.accent : P.fg;
    c.globalAlpha = Math.pow(1 - p, 1.5);
    c.lineWidth = H * 0.012 * (1 - p) + 1;
    c.beginPath(); c.ellipse(W / 2, H * 0.55, Rmax * p * 1.6, Rmax * p * 0.55, 0, 0, TAU); c.stroke();
  }
  c.globalAlpha = 1; c.fillStyle = P.accent;
  c.beginPath(); c.ellipse(W / 2, H * 0.55, H * 0.02 * (1 + 0.3 * Math.sin(TAU * t * 12)), H * 0.008, 0, 0, TAU); c.fill();
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
