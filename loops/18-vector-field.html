<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vector Field · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Vector Field (18) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const g = H / 20;
  c.lineCap = 'round'; c.lineWidth = Math.max(1, H / 360);
  for (let y = g / 2; y < H; y += g) for (let x = g / 2; x < W; x += g) {
    const u = x / W, v = y / H;
    const a = TAU * (Math.sin(TAU * (u * 0.8 + t)) * 0.3 + Math.cos(TAU * (v * 0.9 - t)) * 0.3 + u * 0.5);
    const m = 0.5 + 0.5 * Math.sin(TAU * (u + v - t * 2));
    const L = g * (0.2 + 0.35 * m);
    c.strokeStyle = m > 0.9 ? P.accent : P.fg;
    c.globalAlpha = 0.35 + 0.65 * m;
    c.beginPath(); c.moveTo(x - Math.cos(a) * L, y - Math.sin(a) * L); c.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L); c.stroke();
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
