<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Breath · Equilouds 99 Loops</title>
<style>
  /* Neon Breath (84) · Equilouds 99 Loops · uweschweerlambers.de · License: MIT, free to use, commercial use included */
  :root { --bg: #151419; --fg: #fbfbfb; --accent: #f56e0f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font-size: 18px; }

.btn-neon { padding: .85em 2.2em; border: 2px solid var(--accent); border-radius: .3em; background: transparent; color: var(--accent); font: 700 1em/1 system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; animation: breath 2.8s ease-in-out infinite; transition: background .3s, color .3s; }
.btn-neon:hover { background: var(--accent); color: var(--bg); }
@keyframes breath {
  0%, 100% { box-shadow: 0 0 .4em color-mix(in srgb, var(--accent) 40%, transparent), inset 0 0 .3em color-mix(in srgb, var(--accent) 30%, transparent); text-shadow: 0 0 .3em color-mix(in srgb, var(--accent) 50%, transparent); }
  50% { box-shadow: 0 0 1.4em color-mix(in srgb, var(--accent) 75%, transparent), inset 0 0 .8em color-mix(in srgb, var(--accent) 45%, transparent); text-shadow: 0 0 .8em var(--accent); }
}
</style>
</head>
<body>
  <button class="btn-neon">Live</button>
</body>
</html>
