<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Study · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Orbit Study (55) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2, ph = t % 1;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const hx = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));
  const B = hx(P.bg), F = hx(P.fg);
  const line = 'rgba(' + F.join(',') + ',0.22)';
  const rnd = s => { const h = Math.sin(s) * 43758.5453; return h - Math.floor(h); };
  const cx = W / 2 + H * 0.02 * Math.sin(TAU * ph), cy = H / 2 + H * 0.02 * Math.cos(TAU * ph * 2);
  const nodes = [];
  for (let i = 0; i < 22; i++) {
    const big = i % 4 === 1;
    const speed = (1 + Math.floor(rnd(i * 3.7) * 2)) * (rnd(i * 9.1) > 0.5 ? 1 : -1);   // 1 oder 2 ganze Umläufe pro Loop = nahtlos
    const r0 = H * (0.14 + 0.32 * rnd(i * 5.3)), wob = H * 0.035 * rnd(i * 2.9);
    const a = TAU * (rnd(i * 1.7) + speed * ph);
    const r = r0 + wob * Math.sin(TAU * (ph * 2 + rnd(i * 4.4)));
    nodes.push([cx + Math.cos(a) * r * 1.3, cy + Math.sin(a) * r, big]);
  }
  c.strokeStyle = line; c.lineWidth = Math.max(1, H / 400);
  nodes.forEach(([x, y]) => { c.beginPath(); c.moveTo(cx, cy); c.lineTo(x, y); c.stroke(); });
  nodes.forEach(([x, y, big]) => {
    c.fillStyle = big ? P.accent : P.fg; c.beginPath(); c.arc(x, y, H * (big ? 0.032 : 0.016), 0, TAU); c.fill();
  });
  const pulse = 1 + 0.06 * Math.sin(TAU * ph * 4);
  c.fillStyle = P.fg; c.beginPath(); c.arc(cx, cy, H * 0.05 * pulse, 0, TAU); c.fill();
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
