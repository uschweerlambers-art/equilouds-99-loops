<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar HUD · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Radar HUD (12) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, R = H * 0.44, sw = TAU * t * 2;
  const rnd = s => { const h = Math.sin(s) * 43758.5453; return h - Math.floor(h); };
  c.strokeStyle = P.fg; c.lineWidth = Math.max(1, H / 800);
  c.globalAlpha = 0.08;
  for (let x = cx % (H / 12); x < W; x += H / 12) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
  for (let y = cy % (H / 12); y < H; y += H / 12) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  c.globalAlpha = 0.4;
  for (let k = 1; k <= 4; k++) { c.beginPath(); c.arc(cx, cy, R * k / 4, 0, TAU); c.stroke(); }
  c.beginPath(); c.moveTo(cx - R, cy); c.lineTo(cx + R, cy); c.moveTo(cx, cy - R); c.lineTo(cx, cy + R); c.stroke();
  for (let k = 0; k < 72; k++) { const a = TAU * k / 72, l = k % 6 ? 0.03 : 0.06; c.beginPath(); c.moveTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); c.lineTo(cx + Math.cos(a) * R * (1 + l), cy + Math.sin(a) * R * (1 + l)); c.stroke(); }
  c.fillStyle = P.accent;
  for (let k = 0; k < 40; k++) { const a = sw - k * 0.02; c.globalAlpha = 0.28 * (1 - k / 40); c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, R, a - 0.021, a); c.closePath(); c.fill(); }
  c.globalAlpha = 1; c.strokeStyle = P.accent; c.lineWidth = H / 300;
  c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(sw) * R, cy + Math.sin(sw) * R); c.stroke();
  for (let i = 0; i < 9; i++) {
    const a = rnd(i * 3.7 + 1) * TAU, r = R * (0.2 + 0.75 * rnd(i * 5.9 + 2));
    const age = (((sw - a) % TAU) + TAU) % TAU / TAU, f = Math.pow(1 - age, 2);
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    c.globalAlpha = f; c.fillStyle = P.accent; c.beginPath(); c.arc(x, y, H / 110 * (1 + f), 0, TAU); c.fill();
    c.globalAlpha = f * 0.6; c.lineWidth = Math.max(1, H / 700); c.beginPath(); c.arc(x, y, H / 40 * (1.5 - f), 0, TAU); c.stroke();
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
