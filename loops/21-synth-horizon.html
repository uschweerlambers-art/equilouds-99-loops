<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synth Horizon · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Synth Horizon (21) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const hy = H * 0.6, R = H * 0.24, sy = hy - R * 0.35;
  c.fillStyle = P.accent;
  c.beginPath(); c.arc(W / 2, sy, R, 0, TAU); c.fill();
  c.fillStyle = P.bg;
  const off = (t * 3) % 1;
  for (let k = 0; k < 7; k++) {
    const p = (k + off) / 7;
    const y = sy + R * (0.05 + p * 0.95), hgt = R * 0.02 + p * R * 0.07;
    c.fillRect(W / 2 - R, y, R * 2, hgt);
  }
  c.fillRect(0, hy, W, H - hy);
  c.save(); c.beginPath(); c.rect(0, hy, W, H - hy); c.clip();
  c.strokeStyle = P.fg; c.lineWidth = Math.max(1, H / 500);
  for (let i = -24; i <= 24; i++) {
    c.globalAlpha = 0.8;
    c.beginPath(); c.moveTo(W / 2 + i * W * 0.004, hy); c.lineTo(W / 2 + i * W * 0.11, H); c.stroke();
  }
  const f = (t * 4) % 1;
  for (let k = 1; k < 40; k++) {
    const z = k - f;
    const y = hy + (H - hy) * 0.9 / z;
    c.globalAlpha = Math.min(1, 1.6 / z);
    c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
  }
  c.restore();
  c.globalAlpha = 1; c.strokeStyle = P.accent; c.lineWidth = H / 300;
  c.beginPath(); c.moveTo(0, hy); c.lineTo(W, hy); c.stroke();
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
