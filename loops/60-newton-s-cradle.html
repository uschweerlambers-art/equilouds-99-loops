<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newton’s Cradle · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Newton’s Cradle (60) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const n = 5, r = H * 0.055, L = H * 0.44, top = H * 0.18, A = 0.6;
  const s = Math.sin(TAU * t * 3);
  c.strokeStyle = P.fg; c.lineCap = 'round';
  c.lineWidth = H / 90;
  c.beginPath(); c.moveTo(W / 2 - (n + 1.6) * r, top); c.lineTo(W / 2 + (n + 1.6) * r, top); c.stroke();
  c.lineWidth = Math.max(1, H / 600);
  for (let i = 0; i < n; i++) {
    const px = W / 2 + (i - (n - 1) / 2) * 2 * r;
    let a = 0;
    if (i === 0 && s < 0) a = A * s;
    if (i === n - 1 && s > 0) a = A * s;
    const bx = px + Math.sin(a) * L, by = top + Math.cos(a) * L;
    c.strokeStyle = P.fg; c.globalAlpha = 0.6;
    c.beginPath(); c.moveTo(px, top); c.lineTo(bx, by); c.stroke();
    c.globalAlpha = 1; c.fillStyle = (i === 0 || i === n - 1) ? P.accent : P.fg;
    c.beginPath(); c.arc(bx, by, r * 0.96, 0, TAU); c.fill();
  }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
