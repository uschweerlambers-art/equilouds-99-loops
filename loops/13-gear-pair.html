<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gear Pair · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Gear Pair (13) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const m = H * 0.02;
  const gear = (cx, cy, teeth, ang, col) => {
    const rp = m * teeth / 2, ro = rp + m, ri = rp - 1.25 * m, w = TAU / teeth;
    c.beginPath();
    for (let k = 0; k < teeth; k++) {
      const a0 = ang + w * k;
      [[-0.5, ri], [-0.24, ri], [-0.13, ro], [0.13, ro], [0.24, ri]].forEach(([f, r]) => c.lineTo(cx + r * Math.cos(a0 + f * w), cy + r * Math.sin(a0 + f * w)));
    }
    c.closePath(); c.fillStyle = col; c.fill();
    c.fillStyle = P.bg; c.beginPath(); c.arc(cx, cy, rp * 0.28, 0, TAU); c.fill();
    for (let k = 0; k < 5; k++) { const a = ang + TAU * k / 5 + w / 2; c.beginPath(); c.arc(cx + Math.cos(a) * rp * 0.6, cy + Math.sin(a) * rp * 0.6, rp * 0.13, 0, TAU); c.fill(); }
  };
  const ta = 12, tb = 20, ra = m * ta / 2, rb = m * tb / 2;
  const ax = W / 2 - (ra + rb) / 2 - ra * 0.1, bx = ax + ra + rb;
  const angA = TAU * t;
  gear(bx, H / 2, tb, Math.PI + TAU / tb / 2 - angA * ta / tb, P.fg);
  gear(ax, H / 2, ta, angA, P.accent);
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
