<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Square Whirl · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfb; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Square Whirl (37) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#fbfbfb', fg: '#151419', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const n = 40, a = 0.06 + 0.05 * Math.sin(TAU * t), k = 1 / (Math.cos(a) + Math.sin(a));
  let s = Math.hypot(W, H) * 1.05;
  c.save(); c.translate(W / 2, H / 2); c.rotate(TAU * t / 4);
  c.lineWidth = Math.max(1, H / 500);
  for (let i = 0; i < n; i++) {
    c.strokeStyle = i % 6 === 0 ? P.accent : P.fg;
    c.strokeRect(-s / 2, -s / 2, s, s);
    c.rotate(a); s *= k;
  }
  c.restore();
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
