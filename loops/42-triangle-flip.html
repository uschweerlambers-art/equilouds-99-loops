<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triangle Flip · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Triangle Flip (42) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const s = H / 6, h = s * Math.sqrt(3) / 2, q = 0.92;
  for (let j = -1; j * h < H + h; j++) for (let i = -2; i * s / 2 < W + s; i++) {
    const up = (i + j) % 2 === 0;
    const cx = i * s / 2, cy = j * h + (up ? h * 2 / 3 : h / 3);
    const k = Math.cos(TAU * ((cx / W) * 1.2 + (cy / H) * 0.6 - t * 2));
    c.save(); c.translate(cx, cy); c.scale(q, k * q);
    c.beginPath();
    if (up) { c.moveTo(0, -h * 2 / 3); c.lineTo(s / 2, h / 3); c.lineTo(-s / 2, h / 3); }
    else { c.moveTo(0, h * 2 / 3); c.lineTo(s / 2, -h / 3); c.lineTo(-s / 2, -h / 3); }
    c.closePath();
    c.fillStyle = k < 0 ? P.accent : P.fg; c.globalAlpha = 0.2 + 0.8 * Math.abs(k);
    c.fill(); c.restore();
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
