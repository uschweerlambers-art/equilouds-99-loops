<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diamond Gem · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Diamond Gem (34) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const hx = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));
  const B = hx(P.bg), F = hx(P.fg);
  const mix = k => 'rgb(' + B.map((b, i) => Math.round(b + (F[i] - b) * k)).join(',') + ')';
  const V = [], FACES = [], n = 8;
  for (let k = 0; k < n; k++) { const a = TAU * k / n; V.push([Math.cos(a) * 0.55, -0.62, Math.sin(a) * 0.55]); }
  for (let k = 0; k < n; k++) { const a = TAU * k / n; V.push([Math.cos(a), -0.22, Math.sin(a)]); }
  V.push([0, 1.05, 0]);
  FACES.push([...Array(n).keys()]);
  for (let k = 0; k < n; k++) { const k2 = (k + 1) % n; FACES.push([k, k2, n + k2, n + k]); FACES.push([n + k, n + k2, 2 * n]); }
  const ay = TAU * t, ax = 0.42 + 0.12 * Math.sin(TAU * t), sz = H * 0.3, bob = Math.sin(TAU * t * 2) * H * 0.015;
  const pts = V.map(([x, y, z]) => {
    const X = x * Math.cos(ay) + z * Math.sin(ay), Z0 = -x * Math.sin(ay) + z * Math.cos(ay);
    return [X, y * Math.cos(ax) - Z0 * Math.sin(ax), y * Math.sin(ax) + Z0 * Math.cos(ax)];
  });
  const proj = p => { const f = 5 / (5 + p[2]); return [W / 2 + p[0] * sz * f, H * 0.46 + bob + p[1] * sz * f]; };
  const fs = FACES.map(f => {
    const p = f.map(k => pts[k]);
    const u = [0, 1, 2].map(k => p[1][k] - p[0][k]), v = [0, 1, 2].map(k => p[2][k] - p[0][k]);
    let nn = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
    const cen = [0, 1, 2].map(k => p.reduce((s, q) => s + q[k], 0) / p.length);
    if (nn[0] * cen[0] + nn[1] * cen[1] + nn[2] * cen[2] < 0) nn = nn.map(x => -x);
    const l = Math.hypot(nn[0], nn[1], nn[2]); nn = nn.map(x => x / l);
    return { p, n: nn, z: cen[2] };
  }).filter(f => f.n[2] < 0).sort((a, b) => b.z - a.z);
  fs.forEach(f => {
    const lit = Math.max(0, f.n[0] * -0.45 + f.n[1] * -0.65 + f.n[2] * -0.62);
    c.beginPath(); f.p.forEach(q => { const s = proj(q); c.lineTo(s[0], s[1]); }); c.closePath();
    c.fillStyle = lit > 0.9 ? P.accent : mix(0.08 + 0.92 * Math.pow(lit, 1.6)); c.fill();
    c.strokeStyle = P.fg; c.globalAlpha = 0.35; c.lineWidth = Math.max(1, H / 700); c.stroke(); c.globalAlpha = 1;
  });
  const sp = (t * 3) % 1, k = Math.max(0, 1 - Math.abs(sp - 0.5) * 6);
  if (k > 0) { const s = H * 0.06 * k, x = W / 2 + sz * 0.45, y = H * 0.46 + bob - sz * 0.5; c.strokeStyle = P.accent; c.lineWidth = H / 300; c.beginPath(); c.moveTo(x - s, y); c.lineTo(x + s, y); c.moveTo(x, y - s); c.lineTo(x, y + s); c.stroke(); }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
