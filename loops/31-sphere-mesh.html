<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sphere Mesh · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Sphere Mesh (31) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const R = H * 0.34, ay = TAU * t, ax = 0.45;
  const pr = (x, y, z) => {
    const X = x * Math.cos(ay) + z * Math.sin(ay), Z0 = -x * Math.sin(ay) + z * Math.cos(ay);
    const Y = y * Math.cos(ax) - Z0 * Math.sin(ax), Z = y * Math.sin(ax) + Z0 * Math.cos(ax);
    return [W / 2 + X * R, H / 2 + Y * R, Z];
  };
  c.lineWidth = Math.max(1, H / 600);
  const line = (pts, col, wgt) => {
    for (let k = 0; k < pts.length - 1; k++) {
      const a = pts[k], b = pts[k + 1], z = (a[2] + b[2]) / 2;
      c.strokeStyle = col; c.globalAlpha = z < 0 ? 0.9 : 0.15; c.lineWidth = Math.max(1, H / 600) * wgt;
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
    }
  };
  for (let i = 1; i < 12; i++) {
    const phi = Math.PI * i / 12 - Math.PI / 2, y = Math.sin(phi), r = Math.cos(phi), pts = [];
    for (let k = 0; k <= 48; k++) { const a = TAU * k / 48; pts.push(pr(Math.cos(a) * r, y, Math.sin(a) * r)); }
    line(pts, i === 6 ? P.accent : P.fg, i === 6 ? 2.5 : 1);
  }
  for (let j = 0; j < 16; j++) {
    const a = TAU * j / 16, pts = [];
    for (let k = 0; k <= 24; k++) { const phi = Math.PI * k / 24 - Math.PI / 2; pts.push(pr(Math.cos(a) * Math.cos(phi), Math.sin(phi), Math.sin(a) * Math.cos(phi))); }
    line(pts, P.fg, 1);
  }
  const oa = -TAU * t * 2, o = [Math.cos(oa) * 1.35, Math.sin(oa) * 0.25, Math.sin(oa) * 1.35];
  const p = pr(o[0], o[1], o[2]);
  c.globalAlpha = p[2] < 0 ? 1 : 0.3; c.fillStyle = P.accent; c.beginPath(); c.arc(p[0], p[1], H / 45, 0, TAU); c.fill();
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
