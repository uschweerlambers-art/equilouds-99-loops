<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bounce Row · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfb; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Bounce Row (59) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#fbfbfb', fg: '#151419', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const n = 5, gap = H * 0.13, r = H * 0.045, floor = H * 0.66;
  for (let i = 0; i < n; i++) {
    const ph = (t * 6 + i * 0.12) % 1;
    const hgt = 4 * ph * (1 - ph);
    const edge = Math.min(ph, 1 - ph);
    const sq = edge < 0.08 ? 1 - (0.08 - edge) * 4 : 1;
    const x = W / 2 + (i - (n - 1) / 2) * gap, y = floor - hgt * H * 0.3 - r * sq;
    c.globalAlpha = 0.16 * (1 - hgt * 0.7); c.fillStyle = P.fg;
    c.beginPath(); c.ellipse(x, floor + r * 0.4, r * (1.2 - hgt * 0.5), r * 0.22, 0, 0, TAU); c.fill();
    c.globalAlpha = 1; c.fillStyle = i === 2 ? P.accent : P.fg;
    c.beginPath(); c.ellipse(x, y, r / sq, r * sq, 0, 0, TAU); c.fill();
  }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
