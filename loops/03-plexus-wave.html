<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plexus Wave · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Plexus Wave (03) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const cols = 22, rows = 14, pts = [];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const u = i / (cols - 1) - 0.5, v = j / (rows - 1);
    const h = Math.sin(TAU * (u * 1.5 + t)) * Math.cos(TAU * (v * 0.8 - t * 2)) * 0.5;
    const z = 4 - v * 3;
    pts.push([W / 2 + u * 7 / z * W * 0.22, H * 0.3 + (1.3 - h * 0.9) / z * H * 0.38, z, h]);
  }
  const at = (i, j) => pts[j * cols + i];
  c.lineWidth = Math.max(1, H / 800); c.strokeStyle = P.fg;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const p = at(i, j), nb = [];
    if (i < cols - 1) nb.push(at(i + 1, j));
    if (j < rows - 1) nb.push(at(i, j + 1));
    if (i < cols - 1 && j < rows - 1 && (i + j) % 3 === 0) nb.push(at(i + 1, j + 1));
    nb.forEach(q => { c.globalAlpha = Math.min(1, 0.12 + 0.5 / p[2]); c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.stroke(); });
  }
  pts.forEach(p => { c.globalAlpha = Math.min(1, 0.3 + 0.9 / p[2]); c.fillStyle = p[3] > 0.3 ? P.accent : P.fg; c.beginPath(); c.arc(p[0], p[1], H / 120 / p[2], 0, TAU); c.fill(); });
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
