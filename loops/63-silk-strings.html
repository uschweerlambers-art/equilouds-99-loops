<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silk Strings · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Silk Strings (63) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const hx = h => [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16));
  const A = hx(P.fg), B = hx(P.accent), n = 48;
  c.lineWidth = Math.max(1, H / 600);
  for (let i = 0; i < n; i++) {
    const v = i / (n - 1);
    c.strokeStyle = 'rgb(' + A.map((a, k) => Math.round(a + (B[k] - a) * v)).join(',') + ')';
    c.globalAlpha = 0.35 + 0.65 * Math.sin(Math.PI * v);
    c.beginPath();
    for (let x = 0; x <= W; x += W / 200) {
      const u = x / W;
      c.lineTo(x, H * 0.5 + H * 0.28 * Math.sin(TAU * (u * 0.8 + t) + v * 2.2) * (0.55 + 0.45 * Math.cos(TAU * (u * 0.5 - t))) + (v - 0.5) * H * 0.14);
    }
    c.stroke();
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
