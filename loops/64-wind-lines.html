<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wind Lines · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfb; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Wind Lines (64) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#fbfbfb', fg: '#151419', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const n = 40, L = W / 3;
  c.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const h = Math.sin(i * 91.7) * 43758.5453, r = h - Math.floor(h);
    const y0 = H * (i + 0.5) / n;
    c.beginPath();
    for (let x = -W * 0.05; x <= W * 1.05; x += W / 80) {
      const u = x / W;
      c.lineTo(x, y0 + H * 0.05 * Math.sin(TAU * (u * 1.2 + r)) + H * 0.02 * Math.sin(TAU * (u * 3 + i * 0.1)));
    }
    const a = L * (0.15 + 0.35 * r);
    c.setLineDash([a, L - a]);
    c.lineDashOffset = -(t * (1 + i % 3) + r) * L;
    c.lineWidth = H / 300 * (1 + r * 1.5);
    c.strokeStyle = i % 9 === 0 ? P.accent : P.fg;
    c.globalAlpha = 0.35 + 0.65 * r;
    c.stroke();
  }
  c.setLineDash([]); c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
