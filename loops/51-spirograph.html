<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirograph · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Spirograph (51) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const k = H * 0.3 / 8, rot = TAU * t;
  const pos = u => {
    const x = 4 * k * Math.cos(u) + 4 * k * Math.cos(4 / 3 * u), y = 4 * k * Math.sin(u) - 4 * k * Math.sin(4 / 3 * u);
    return [W / 2 + x * Math.cos(rot) - y * Math.sin(rot), H / 2 + x * Math.sin(rot) + y * Math.cos(rot)];
  };
  const full = TAU * 3;
  c.strokeStyle = P.fg; c.globalAlpha = 0.18; c.lineWidth = Math.max(1, H / 600);
  c.beginPath(); for (let i = 0; i <= 600; i++) { const p = pos(full * i / 600); c.lineTo(p[0], p[1]); } c.stroke();
  c.lineCap = 'round';
  for (let j = 0; j < 2; j++) {
    const head = full * (t + j * 0.5);
    c.strokeStyle = j ? P.fg : P.accent;
    for (let i = 0; i < 90; i++) {
      const a = pos(head - i * 0.035), b = pos(head - (i + 1) * 0.035);
      c.globalAlpha = 1 - i / 90; c.lineWidth = H / 120 * (1 - i / 90) + 1;
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
    }
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
