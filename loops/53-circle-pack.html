<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle Pack · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfb; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Circle Pack (53) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#fbfbfb', fg: '#151419', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const r = H / 16, w = r * 2, h = r * Math.sqrt(3);
  c.lineWidth = Math.max(1, H / 700);
  for (let j = -1; j * h < H + h; j++) for (let i = -1; i * w < W + w; i++) {
    const x = i * w + (j % 2 ? r : 0), y = j * h;
    const k = 0.5 + 0.5 * Math.sin(TAU * (Math.hypot(x - W / 2, y - H / 2) / H * 1.5 - t * 2));
    c.strokeStyle = P.fg; c.globalAlpha = 0.35;
    c.beginPath(); c.arc(x, y, r * 0.95, 0, TAU); c.stroke();
    c.globalAlpha = 1; c.fillStyle = k > 0.75 ? P.accent : P.fg;
    c.beginPath(); c.arc(x, y, r * 0.9 * k, 0, TAU); c.fill();
    if (k > 0.3) { c.fillStyle = P.bg; c.beginPath(); c.arc(x, y, r * 0.4 * k, 0, TAU); c.fill(); }
  }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
