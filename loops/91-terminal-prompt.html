<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Prompt · Equilouds 99 Loops</title>
<style>
  /* Terminal Prompt (91) · Equilouds 99 Loops · uweschweerlambers.de · License: MIT, free to use, commercial use included */
  :root { --bg: #151419; --fg: #fbfbfb; --accent: #f56e0f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font-size: 18px; }

.btn-term { display: inline-flex; align-items: center; gap: .55em; padding: .85em 1.4em; border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); border-radius: .35em; background: color-mix(in srgb, var(--accent) 8%, var(--bg)); color: var(--fg); font: 500 1em/1 ui-monospace, Menlo, Consolas, monospace; cursor: pointer; transition: background .25s; }
.btn-term::before { content: ">"; color: var(--accent); }
.btn-term::after { content: ""; width: .55em; height: 1.1em; background: var(--accent); animation: caret 1s steps(1) infinite; }
.btn-term:hover { background: color-mix(in srgb, var(--accent) 20%, var(--bg)); }
@keyframes caret { 50% { opacity: 0; } }
</style>
</head>
<body>
  <button class="btn-term">run showreel</button>
</body>
</html>
