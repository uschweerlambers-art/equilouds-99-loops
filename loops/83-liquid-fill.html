<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Fill · Equilouds 99 Loops</title>
<style>
  /* Liquid Fill (83) · Equilouds 99 Loops · uweschweerlambers.de · License: MIT, free to use, commercial use included */
  :root { --bg: #151419; --fg: #fbfbfb; --accent: #f56e0f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font-size: 18px; }

.btn-fill { position: relative; overflow: hidden; padding: .95em 2em; border: 1.5px solid var(--accent); border-radius: .4em; background: transparent; color: var(--accent); font: 600 1em/1 system-ui, sans-serif; cursor: pointer; isolation: isolate; transition: color .4s; }
.btn-fill::before { content: ""; position: absolute; left: 50%; top: 78%; width: 220%; aspect-ratio: 1; background: var(--accent); border-radius: 42%; z-index: -1; transform: translateX(-50%) rotate(0); animation: slosh 5s linear infinite; transition: top .6s cubic-bezier(.2,.8,.2,1); }
.btn-fill:hover { color: var(--bg); }
.btn-fill:hover::before { top: -60%; }
@keyframes slosh { to { transform: translateX(-50%) rotate(1turn); } }
</style>
</head>
<body>
  <button class="btn-fill">Newsletter</button>
</body>
</html>
