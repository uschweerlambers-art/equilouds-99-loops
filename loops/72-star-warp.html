<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Warp · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Star Warp (72) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const N = 260, D = Math.hypot(W, H) / 2;
  c.lineCap = 'round';
  for (let i = 0; i < N; i++) {
    const h1 = Math.sin(i * 12.9898) * 43758.5453, a = (h1 - Math.floor(h1)) * TAU;
    const h2 = Math.sin(i * 78.233) * 12543.123, r0 = h2 - Math.floor(h2);
    const z = (r0 + t * 2) % 1;
    const d1 = Math.pow(z, 3) * D * 1.2, d0 = Math.pow(Math.max(0, z - 0.05), 3) * D * 1.2;
    c.strokeStyle = i % 11 === 0 ? P.accent : P.fg;
    c.globalAlpha = Math.min(1, z * 2);
    c.lineWidth = Math.max(1, z * H / 200);
    c.beginPath();
    c.moveTo(W / 2 + Math.cos(a) * d0, H / 2 + Math.sin(a) * d0);
    c.lineTo(W / 2 + Math.cos(a) * d1, H / 2 + Math.sin(a) * d1);
    c.stroke();
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
