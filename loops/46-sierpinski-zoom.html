<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sierpinski Zoom · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Sierpinski Zoom (46) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const h3 = Math.sqrt(3) / 2, L = W * 4 * Math.pow(2, t), minS = H / 45;
  const ax = 0, ay = H;
  c.fillStyle = P.fg;
  c.strokeStyle = P.accent; c.lineWidth = Math.max(1, H / 500);
  const holes = [];
  const tri = (x, y, s) => {
    if (x > W || x + s < 0 || y - s * h3 > H || y < 0) return;
    if (s < minS) { c.beginPath(); c.moveTo(x, y); c.lineTo(x + s, y); c.lineTo(x + s / 2, y - s * h3); c.closePath(); c.fill(); return; }
    if (s < H * 0.8) holes.push([x, y, s]);
    tri(x, y, s / 2); tri(x + s / 2, y, s / 2); tri(x + s / 4, y - s * h3 / 2, s / 2);
  };
  tri(ax, ay, L);
  holes.forEach(([x, y, s]) => {
    c.globalAlpha = Math.min(1, s / (H * 0.15));
    c.beginPath(); c.moveTo(x + s / 4, y - s * h3 / 2); c.lineTo(x + s * 3 / 4, y - s * h3 / 2); c.lineTo(x + s / 2, y); c.closePath(); c.stroke();
  });
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
