<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Ring · Equilouds 99 Loops</title>
<style>
  /* Pulse Ring (81) · Equilouds 99 Loops · uweschweerlambers.de · License: MIT, free to use, commercial use included */
  :root { --bg: #fbfbfb; --fg: #151419; --accent: #f56e0f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font-size: 18px; }

.btn-pulse { position: relative; padding: .9em 1.8em; border: 0; border-radius: 999px; background: var(--accent); color: var(--bg); font: 600 1em/1 system-ui, sans-serif; cursor: pointer; }
.btn-pulse::before, .btn-pulse::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--accent); animation: pulse 2.4s ease-out infinite; pointer-events: none; }
.btn-pulse::after { animation-delay: 1.2s; }
@keyframes pulse { from { transform: scale(1); opacity: .8; } to { transform: scale(1.35, 1.9); opacity: 0; } }
</style>
</head>
<body>
  <button class="btn-pulse">Get started</button>
</body>
</html>
