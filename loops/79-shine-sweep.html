<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shine Sweep · Equilouds 99 Loops</title>
<style>
  /* Shine Sweep (79) · Equilouds 99 Loops · uweschweerlambers.de · License: MIT, free to use, commercial use included */
  :root { --bg: #151419; --fg: #fbfbfb; --accent: #f56e0f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font-size: 18px; }

.btn-shine { position: relative; overflow: hidden; padding: .9em 1.8em; border: 0; border-radius: .5em; background: var(--accent); color: var(--bg); font: 600 1em/1 system-ui, sans-serif; letter-spacing: .02em; cursor: pointer; }
.btn-shine::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); transform: translateX(-100%); animation: shine 3s ease-in-out infinite; }
.btn-shine:hover::after { animation-duration: 1s; }
@keyframes shine { 0%, 40% { transform: translateX(-100%); } 70%, 100% { transform: translateX(100%); } }
</style>
</head>
<body>
  <button class="btn-shine">Request a project</button>
</body>
</html>
