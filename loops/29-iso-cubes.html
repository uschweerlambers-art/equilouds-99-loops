<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iso Cubes · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Iso Cubes (29) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const s = H / 16, cx = s * Math.cos(Math.PI / 6), N = 14;
  const face = (pts, a, col) => {
    c.beginPath(); pts.forEach(p => c.lineTo(p[0], p[1])); c.closePath();
    c.globalAlpha = 1; c.fillStyle = P.bg; c.fill();
    c.globalAlpha = a; c.fillStyle = col; c.fill();
  };
  for (let sum = 0; sum <= 2 * (N - 1); sum++) for (let i = 0; i < N; i++) {
    const j = sum - i; if (j < 0 || j >= N) continue;
    const x = W / 2 + (i - j) * cx, y = H * 0.1 + (i + j) * s * 0.5;
    const d = Math.hypot(i - N / 2 + 0.5, j - N / 2 + 0.5);
    const k = 0.5 + 0.5 * Math.sin(TAU * t * 2 - d * 0.7);
    const h = s * (0.4 + 2.2 * k);
    face([[x - cx, y - h + s / 2], [x, y - h + s], [x, y + s], [x - cx, y + s / 2]], 0.55, P.fg);
    face([[x + cx, y - h + s / 2], [x, y - h + s], [x, y + s], [x + cx, y + s / 2]], 0.28, P.fg);
    face([[x, y - h], [x + cx, y - h + s / 2], [x, y - h + s], [x - cx, y - h + s / 2]], 0.92, k > 0.9 ? P.accent : P.fg);
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
