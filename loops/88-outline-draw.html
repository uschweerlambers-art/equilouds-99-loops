<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outline Draw · Equilouds 99 Loops</title>
<style>
  /* Outline Draw (88) · Equilouds 99 Loops · uweschweerlambers.de · License: MIT, free to use, commercial use included */
  :root { --bg: #151419; --fg: #fbfbfb; --accent: #f56e0f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font-size: 18px; }

.btn-draw { padding: .95em 2.2em; border: 0; color: var(--fg); font: 600 1em/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
  background-color: transparent;
  background-image: linear-gradient(var(--accent), var(--accent)), linear-gradient(var(--accent), var(--accent)), linear-gradient(var(--accent), var(--accent)), linear-gradient(var(--accent), var(--accent));
  background-repeat: no-repeat;
  background-position: 0 0, 100% 0, 100% 100%, 0 100%;
  background-size: 0 2px, 2px 0, 0 2px, 2px 0;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 22%, transparent);
  animation: draw 4s ease-in-out infinite; transition: color .3s; }
.btn-draw:hover { animation: none; background-size: 100% 2px, 2px 100%, 100% 2px, 2px 100%; color: var(--accent); }
@keyframes draw {
  0% { background-size: 0 2px, 2px 0, 0 2px, 2px 0; }
  20% { background-size: 100% 2px, 2px 0, 0 2px, 2px 0; }
  30% { background-size: 100% 2px, 2px 100%, 0 2px, 2px 0; }
  50% { background-size: 100% 2px, 2px 100%, 100% 2px, 2px 0; }
  60%, 80% { background-size: 100% 2px, 2px 100%, 100% 2px, 2px 100%; }
  100% { background-size: 0 2px, 2px 0, 0 2px, 2px 0; }
}
</style>
</head>
<body>
  <button class="btn-draw">Contact</button>
</body>
</html>
