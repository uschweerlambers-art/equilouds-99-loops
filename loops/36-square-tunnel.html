<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Square Tunnel · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Square Tunnel (36) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  c.save(); c.translate(W / 2, H / 2);
  const n = 18, D = Math.hypot(W, H) * 1.1;
  for (let i = 0; i < n; i++) {
    const z = ((i + t * 3) % n) / n;
    const s = Math.pow(z, 2.2) * D;
    c.save();
    c.rotate(z * Math.PI * 0.75);
    c.lineWidth = Math.max(1, s / 90);
    c.strokeStyle = i % 3 === 0 ? P.accent : P.fg;
    c.globalAlpha = Math.min(1, z * 4);
    c.strokeRect(-s / 2, -s / 2, s, s);
    c.restore();
  }
  c.restore(); c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
