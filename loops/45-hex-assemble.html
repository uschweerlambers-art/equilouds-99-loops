<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex Assemble · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Hex Assemble (45) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const ph = (t * 2) % 1, R = H * 0.26, far = H * 1.3;
  const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
  const spin = TAU / 6 * ease((ph - 0.35) / 0.25);
  for (let k = 0; k < 6; k++) {
    const inT = ease((ph - k * 0.025) / 0.25), outT = ease((ph - 0.68 - k * 0.025) / 0.18);
    const d = (1 - inT) * far + outT * far;
    const a0 = TAU * k / 6 + spin, mid = a0 + TAU / 12;
    const v = [[0, 0], [R * Math.cos(a0), R * Math.sin(a0)], [R * Math.cos(a0 + TAU / 6), R * Math.sin(a0 + TAU / 6)]];
    const gx = (v[1][0] + v[2][0]) / 3, gy = (v[1][1] + v[2][1]) / 3;
    c.save();
    c.translate(W / 2 + Math.cos(mid) * d, H / 2 + Math.sin(mid) * d);
    c.translate(gx, gy); c.rotate((1 - inT) * Math.PI - outT * Math.PI); c.translate(-gx, -gy);
    c.beginPath(); v.forEach(p => c.lineTo(p[0], p[1])); c.closePath();
    c.fillStyle = k % 2 ? P.fg : P.accent;
    c.fill();
    c.restore();
  }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
