<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diamond Lattice · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfb; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Diamond Lattice (35) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#fbfbfb', fg: '#151419', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const hx = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));
  const B = hx(P.bg), F = hx(P.fg);
  const mix = k => 'rgb(' + B.map((b, i) => Math.round(b + (F[i] - b) * k)).join(',') + ')';
  const w = H / 5, h = H / 3.2, la = -TAU * t;
  const lx = Math.cos(la) * 0.7, ly = Math.sin(la) * 0.7, lz = 0.7;
  for (let j = -1; j * h / 2 < H + h; j++) for (let i = -1; i * w < W + w; i++) {
    const cx = i * w + (j % 2 ? w / 2 : 0), cy = j * h / 2;
    const hgt = w * (0.2 + 0.5 * (0.5 + 0.5 * Math.sin(TAU * (t * 2 + cx / W * 0.8 + cy / H * 0.5))));
    const V = [[cx, cy - h / 2], [cx + w / 2, cy], [cx, cy + h / 2], [cx - w / 2, cy]];
    for (let k = 0; k < 4; k++) {
      const a = V[k], b = V[(k + 1) % 4];
      const mx = (a[0] + b[0]) / 2 - cx, my = (a[1] + b[1]) / 2 - cy, ml = Math.hypot(mx, my);
      const len = Math.hypot(hgt, ml), n0 = mx / ml * hgt / len, n1 = my / ml * hgt / len, n2 = ml / len;
      const lit = Math.max(0, n0 * lx + n1 * ly + n2 * lz);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.lineTo(cx, cy); c.closePath();
      c.fillStyle = mix(0.08 + 0.9 * lit * lit); c.fill();
    }
    if (hgt > w * 0.6) { c.fillStyle = P.accent; c.beginPath(); c.arc(cx, cy, H / 160, 0, TAU); c.fill(); }
  }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
