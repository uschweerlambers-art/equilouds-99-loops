<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar System · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Solar System (77) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, e = 0.42;
  const pl = [[0.12, 6, 0.012], [0.19, 4, 0.016], [0.27, 3, 0.02], [0.36, 2, 0.014], [0.46, 1, 0.026]];
  c.lineWidth = Math.max(1, H / 800); c.strokeStyle = P.fg; c.globalAlpha = 0.25;
  pl.forEach(([r]) => { c.beginPath(); c.ellipse(cx, cy, H * r * 1.7, H * r * 1.7 * e, 0, 0, TAU); c.stroke(); });
  const pos = pl.map(([r, n, s], k) => { const a = TAU * (t * n + k * 0.21); return [cx + Math.cos(a) * H * r * 1.7, cy + Math.sin(a) * H * r * 1.7 * e, H * s, Math.sin(a), a, r, k]; });
  const drawP = ([x, y, s, , a, r, k]) => {
    c.strokeStyle = P.fg;
    for (let i = 1; i < 14; i++) { const b = a - i * 0.04; c.globalAlpha = 0.25 * (1 - i / 14); c.beginPath(); c.arc(cx + Math.cos(b) * H * r * 1.7, cy + Math.sin(b) * H * r * 1.7 * e, s * 0.5, 0, TAU); c.stroke(); }
    c.globalAlpha = 1; c.fillStyle = k === 2 ? P.accent : P.fg; c.beginPath(); c.arc(x, y, s, 0, TAU); c.fill();
  };
  pos.filter(p => p[3] < 0).forEach(drawP);
  c.globalAlpha = 0.2; c.fillStyle = P.accent; c.beginPath(); c.arc(cx, cy, H * 0.075 * (1 + 0.06 * Math.sin(TAU * t * 4)), 0, TAU); c.fill();
  c.globalAlpha = 1; c.beginPath(); c.arc(cx, cy, H * 0.05, 0, TAU); c.fill();
  pos.filter(p => p[3] >= 0).forEach(drawP);
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
