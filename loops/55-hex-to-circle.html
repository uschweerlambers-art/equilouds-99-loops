<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex to Circle · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Hex to Circle (55) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2, seg = TAU / 6;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, R = H * 0.34;
  c.lineWidth = H / 260;
  for (let layer = 0; layer < 6; layer++) {
    const rr = R * (1 - layer * 0.15);
    const m = 0.5 - 0.5 * Math.cos(TAU * (t * 2 - layer * 0.05));
    const rot = seg * t * (layer % 2 ? -1 : 1);
    c.beginPath();
    for (let a = 0; a <= 180; a++) {
      const th = TAU * a / 180;
      const local = ((th % seg) + seg) % seg - seg / 2;
      const hexR = Math.cos(seg / 2) / Math.cos(local);
      const r = rr * (hexR * (1 - m) + m);
      c.lineTo(cx + r * Math.cos(th + rot), cy + r * Math.sin(th + rot));
    }
    c.closePath();
    c.strokeStyle = layer === 0 ? P.accent : P.fg;
    c.globalAlpha = 1 - layer * 0.14;
    c.stroke();
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
