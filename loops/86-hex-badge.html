<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex Badge · Equilouds 99 Loops</title>
<style>
  /* Hex Badge (86) · Equilouds 99 Loops · uweschweerlambers.de · License: MIT, free to use, commercial use included */
  :root { --bg: #151419; --fg: #fbfbfb; --accent: #f56e0f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font-size: 18px; }

.btn-hex { position: relative; width: 6.5em; aspect-ratio: 1 / 1.1547; border: 0; padding: 0; background: var(--fg); color: var(--fg); font: 700 .9em/1.15 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); isolation: isolate; overflow: hidden; transition: color .3s, transform .3s; }
.btn-hex::before { content: ""; position: absolute; left: 50%; top: 50%; width: 170%; aspect-ratio: 1; background: conic-gradient(var(--accent) 0 25%, transparent 25% 50%, var(--accent) 50% 75%, transparent 75%); transform: translate(-50%, -50%); animation: hexspin 5s linear infinite; z-index: -2; }
.btn-hex::after { content: ""; position: absolute; inset: .28em; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--bg); z-index: -1; transition: background .3s; }
.btn-hex:hover { color: var(--bg); transform: scale(1.05); }
.btn-hex:hover::after { background: var(--accent); }
@keyframes hexspin { to { transform: translate(-50%, -50%) rotate(1turn); } }
</style>
</head>
<body>
  <button class="btn-hex">Play<br>Reel</button>
</body>
</html>
