<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bauhaus Tiles · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfb; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Bauhaus Tiles (39) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#fbfbfb', fg: '#151419', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const s = H / 4, cols = Math.ceil(W / s);
  for (let j = 0; j < 4; j++) for (let i = 0; i < cols; i++) {
    const h = Math.sin(i * 127.1 + j * 311.7) * 43758.5453, r = h - Math.floor(h);
    const u = t * 4 + r, ph = u % 1;
    const e = ph < 0.3 ? 0.5 - 0.5 * Math.cos(Math.PI * ph / 0.3) : 1;
    c.save(); c.translate(i * s + s / 2, j * s + s / 2); c.rotate((Math.floor(u) + e) * Math.PI / 2);
    c.fillStyle = (i + j * 2) % 5 === 0 ? P.accent : P.fg;
    c.beginPath();
    const type = Math.floor(r * 4);
    if (type === 0) { c.moveTo(-s / 2, -s / 2); c.arc(-s / 2, -s / 2, s, 0, Math.PI / 2); }
    else if (type === 1) { c.arc(0, -s / 2, s / 2, 0, Math.PI); }
    else if (type === 2) { c.moveTo(-s / 2, -s / 2); c.lineTo(s / 2, -s / 2); c.lineTo(-s / 2, s / 2); }
    else { c.arc(s * 0.18, s * 0.18, s * 0.3, 0, Math.PI * 2); }
    c.fill(); c.restore();
  }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
