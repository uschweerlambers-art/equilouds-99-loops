<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinity Trail · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Infinity Trail (15) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const A = H * 0.42;
  const pos = u => { const s = Math.sin(u), cc = Math.cos(u), d = 1 + s * s; return [W / 2 + A * 1.3 * cc / d, H / 2 + A * s * cc / d]; };
  c.strokeStyle = P.fg; c.globalAlpha = 0.15; c.lineWidth = H / 400;
  c.beginPath(); for (let k = 0; k <= 200; k++) { const p = pos(TAU * k / 200); c.lineTo(p[0], p[1]); } c.stroke();
  c.lineCap = 'round';
  for (let j = 0; j < 2; j++) {
    const head = TAU * (t * 2 + j * 0.5);
    c.strokeStyle = j ? P.fg : P.accent;
    for (let k = 0; k < 60; k++) {
      const a = pos(head - k * 0.03), b = pos(head - (k + 1) * 0.03);
      c.globalAlpha = 1 - k / 60; c.lineWidth = H / 40 * (1 - k / 60) + 1;
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
    }
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
