<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyramid Field · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Pyramid Field (33) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const hx = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));
  const B = hx(P.bg), F = hx(P.fg), A = hx(P.accent);
  const mix = (X, k) => 'rgb(' + B.map((b, i) => Math.round(b + (X[i] - b) * k)).join(',') + ')';
  const s = H / 8, la = TAU * t, lx = Math.cos(la) * 0.75, ly = Math.sin(la) * 0.75, lz = 0.66;
  for (let j = 0; j * s < H; j++) for (let i = 0; i * s < W; i++) {
    const x = i * s, y = j * s, cx = x + s / 2, cy = y + s / 2;
    const hgt = s * (0.15 + 0.55 * (0.5 + 0.5 * Math.sin(TAU * (t * 2 - (Math.hypot(cx - W / 2, cy - H / 2) / H) * 1.3))));
    const faces = [[[x, y], [x + s, y], [0, -1]], [[x + s, y], [x + s, y + s], [1, 0]], [[x + s, y + s], [x, y + s], [0, 1]], [[x, y + s], [x, y], [-1, 0]]];
    faces.forEach(([a, b, [nx, ny]]) => {
      const len = Math.hypot(hgt, s / 2), n0 = nx * hgt / len, n1 = ny * hgt / len, n2 = (s / 2) / len;
      const lit = Math.max(0, n0 * lx + n1 * ly + n2 * lz);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.lineTo(cx, cy); c.closePath();
      c.fillStyle = lit > 0.93 ? mix(A, 1) : mix(F, 0.1 + 0.85 * lit * lit); c.fill();
    });
  }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
