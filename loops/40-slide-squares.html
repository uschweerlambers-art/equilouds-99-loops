<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide Squares · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfb; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Slide Squares (40) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#fbfbfb', fg: '#151419', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const s = H * 0.15, gap = s * 0.16, cells = [[0, 0], [1, 0], [1, 1], [0, 1]];
  const u = t * 12, step = Math.floor(u), f = u - step;
  const ease = f < 0.6 ? (1 - Math.cos(Math.PI * f / 0.6)) / 2 : 1;
  const pos = [0, 1, 2]; let empty = 3;
  for (let i = 0; i < step; i++) { const from = (empty + 3) % 4; pos[pos.indexOf(from)] = empty; empty = from; }
  const mover = pos.indexOf((empty + 3) % 4);
  const ox = W / 2 - s - gap / 2, oy = H / 2 - s - gap / 2;
  c.strokeStyle = P.fg; c.globalAlpha = 0.2; c.lineWidth = Math.max(1, H / 600);
  c.strokeRect(ox - gap, oy - gap, s * 2 + gap * 3, s * 2 + gap * 3); c.globalAlpha = 1;
  pos.forEach((cell, k) => {
    let [x, y] = cells[cell];
    if (k === mover) { const [tx, ty] = cells[empty]; x += (tx - x) * ease; y += (ty - y) * ease; }
    c.fillStyle = k === 0 ? P.accent : P.fg;
    c.fillRect(ox + x * (s + gap), oy + y * (s + gap), s, s);
  });
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
