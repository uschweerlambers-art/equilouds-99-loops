<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Op-Art Warp · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfb; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Op-Art Warp (38) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#fbfbfb', fg: '#151419', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const s = H / 16, nx = Math.ceil(W / 2 / s) + 2, ny = 10;
  const map = (x, y) => {
    const dx = x - W / 2, dy = y - H / 2, d = Math.hypot(dx, dy) / H;
    const k = 1 + 0.35 * Math.sin(TAU * (d * 1.2 - t)) * Math.exp(-d * 1.5);
    return [W / 2 + dx * k, H / 2 + dy * k];
  };
  for (let j = -ny; j < ny; j++) for (let i = -nx; i < nx; i++) {
    if ((i + j) % 2) continue;
    const x = W / 2 + i * s, y = H / 2 + j * s;
    const a = map(x, y), b = map(x + s, y), cc = map(x + s, y + s), d = map(x, y + s);
    c.fillStyle = ((i * 7 + j * 3) % 11 + 11) % 11 === 0 ? P.accent : P.fg;
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.lineTo(cc[0], cc[1]); c.lineTo(d[0], d[1]); c.closePath(); c.fill();
  }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
