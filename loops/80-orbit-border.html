<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Border · Equilouds 99 Loops</title>
<style>
  /* Orbit Border (80) · Equilouds 99 Loops · uweschweerlambers.de · License: MIT, free to use, commercial use included */
  :root { --bg: #151419; --fg: #fbfbfb; --accent: #f56e0f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font-size: 18px; }

.btn-orbit { position: relative; padding: .95em 1.9em; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--fg) 18%, var(--bg)); color: var(--fg); font: 600 1em/1 system-ui, sans-serif; cursor: pointer; isolation: isolate; overflow: hidden; }
.btn-orbit::before { content: ""; position: absolute; left: 50%; top: 50%; width: 300%; aspect-ratio: 1; background: conic-gradient(from 0deg, transparent 0 65%, var(--accent) 85%, transparent 100%); transform: translate(-50%, -50%) rotate(0); animation: orbit 3s linear infinite; z-index: -2; }
.btn-orbit::after { content: ""; position: absolute; inset: 2px; border-radius: inherit; background: var(--bg); z-index: -1; }
.btn-orbit:hover::before { animation-duration: 1s; }
@keyframes orbit { to { transform: translate(-50%, -50%) rotate(1turn); } }
</style>
</head>
<body>
  <button class="btn-orbit">Watch showreel</button>
</body>
</html>
