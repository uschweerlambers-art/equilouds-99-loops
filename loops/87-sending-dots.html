<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sending Dots · Equilouds 99 Loops</title>
<style>
  /* Sending Dots (87) · Equilouds 99 Loops · uweschweerlambers.de · License: MIT, free to use, commercial use included */
  :root { --bg: #fbfbfb; --fg: #151419; --accent: #f56e0f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font-size: 18px; }

.btn-load { display: inline-flex; align-items: center; gap: .8em; padding: .95em 1.6em; border: 0; border-radius: .5em; background: var(--fg); color: var(--bg); font: 600 1em/1 system-ui, sans-serif; cursor: pointer; }
.btn-load i { display: inline-flex; gap: .25em; }
.btn-load b { width: .42em; height: .42em; border-radius: 50%; background: var(--accent); animation: hop 1.2s ease-in-out infinite; }
.btn-load b:nth-child(2) { animation-delay: .15s; }
.btn-load b:nth-child(3) { animation-delay: .3s; }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-.4em); opacity: 1; } }
</style>
</head>
<body>
  <button class="btn-load">Sending <i aria-hidden="true"><b></b><b></b><b></b></i></button>
</body>
</html>
