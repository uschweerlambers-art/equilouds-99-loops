<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radial EQ · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Radial EQ (11) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const n = 72, R = H * 0.17;
  c.lineCap = 'round'; c.lineWidth = H * 0.011;
  for (let i = 0; i < n; i++) {
    const a = TAU * i / n - Math.PI / 2;
    const v = 0.5 + 0.3 * Math.sin(TAU * (i / n * 3 + t * 2)) + 0.2 * Math.sin(TAU * (i / n * 7 - t * 3));
    const L = H * (0.03 + 0.2 * v * v);
    c.strokeStyle = v > 0.85 ? P.accent : P.fg;
    c.beginPath(); c.moveTo(W / 2 + Math.cos(a) * R, H / 2 + Math.sin(a) * R); c.lineTo(W / 2 + Math.cos(a) * (R + L), H / 2 + Math.sin(a) * (R + L)); c.stroke();
  }
  c.strokeStyle = P.accent; c.lineWidth = H * 0.008;
  c.beginPath(); c.arc(W / 2, H / 2, R * (0.7 + 0.08 * Math.sin(TAU * t * 4)), 0, TAU); c.stroke();
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
