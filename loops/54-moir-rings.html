<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moiré Rings · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfb; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Moiré Rings (54) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#fbfbfb', fg: '#151419', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const R = Math.hypot(W, H), gap = H / 50;
  c.lineWidth = gap * 0.42;
  [[P.fg, 1, 0], [P.accent, -1, 0.5]].forEach(([col, dir, off]) => {
    const cx = W / 2 + W * 0.12 * Math.cos(TAU * (t * dir + off)), cy = H / 2 + H * 0.12 * Math.sin(TAU * (t * dir + off));
    c.strokeStyle = col; c.globalAlpha = 0.85;
    for (let r = gap; r < R; r += gap) { c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.stroke(); }
  });
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
