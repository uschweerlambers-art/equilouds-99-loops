<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaleidoscope · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Kaleidoscope (43) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const seg = 12, R = Math.hypot(W, H) / 2;
  c.save(); c.translate(W / 2, H / 2);
  for (let k = 0; k < seg; k++) {
    c.save(); c.rotate(TAU * k / seg); if (k % 2) { c.rotate(TAU / seg); c.scale(1, -1); }
    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, 0, TAU / seg); c.closePath(); c.clip();
    for (let m = 0; m < 8; m++) {
      const rr = R * (0.06 + 0.12 * m + 0.04 * Math.sin(TAU * (t + m * 0.17)));
      const a = TAU / seg * (0.5 + 0.45 * Math.sin(TAU * (t * (1 + m % 2) + m * 0.3)));
      const sz = R * (0.04 + 0.025 * m);
      c.save(); c.translate(Math.cos(a) * rr, Math.sin(a) * rr); c.rotate(TAU * t * (m % 2 ? 1 : -1) + m);
      c.beginPath(); c.moveTo(0, -sz); c.lineTo(sz * 0.87, sz * 0.5); c.lineTo(-sz * 0.87, sz * 0.5); c.closePath();
      c.fillStyle = m % 3 === 0 ? P.accent : P.fg; c.globalAlpha = m % 3 === 0 ? 1 : 0.75; c.fill();
      c.restore();
    }
    c.restore();
  }
  c.restore(); c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
