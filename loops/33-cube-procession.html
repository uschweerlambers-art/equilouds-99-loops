<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Procession · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Cube Procession (33) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const hx = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));
  const B = hx(P.bg), F = hx(P.fg), A = hx(P.accent);
  const mix = (X, k) => 'rgb(' + B.map((b, i) => Math.round(b + (X[i] - b) * k)).join(',') + ')';
  const n = 4, g = 1.5, N = 3 * n, s = H / 9.5, C = Math.cos(Math.PI / 6);
  const pos = q => {
    q = ((q % N) + N) % N; const seg = Math.floor(q / n), f = (q - seg * n) * g, L = n * g;
    return seg === 0 ? [f, 0, 0] : seg === 1 ? [L, f, 0] : [L, L, f];
  };
  const raw = (x, y, z) => [(x - y) * C, (x + y) * 0.5 - z];
  const ctr = raw(n * g * 2 / 3 + 0.5, n * g / 3 + 0.5, 0.5);
  const iso = (x, y, z) => { const q = raw(x, y, z); return [W / 2 + (q[0] - ctr[0]) * s, H / 2 + (q[1] - ctr[1]) * s]; };
  c.strokeStyle = P.bg; c.lineWidth = Math.max(1, H / 400); c.lineJoin = 'round';
  const face = (pts, col) => { c.beginPath(); pts.forEach(p => { const q = iso(p[0], p[1], p[2]); c.lineTo(q[0], q[1]); }); c.closePath(); c.fillStyle = col; c.fill(); c.stroke(); };
  const items = [];
  for (let i = 0; i < N; i++) { const p = pos(i + (t % 1) * N); items.push([p, i === 0]); }
  items.sort((a, b) => (a[0][0] + a[0][1] - 2 * a[0][2]) - (b[0][0] + b[0][1] - 2 * b[0][2]));
  items.forEach(([[x, y, z], hot]) => {
    const X = hot ? A : F;
    face([[x + 1, y, z], [x + 1, y + 1, z], [x + 1, y + 1, z + 1], [x + 1, y, z + 1]], mix(X, 0.55));
    face([[x, y + 1, z], [x + 1, y + 1, z], [x + 1, y + 1, z + 1], [x, y + 1, z + 1]], mix(X, 0.3));
    face([[x, y, z + 1], [x + 1, y, z + 1], [x + 1, y + 1, z + 1], [x, y + 1, z + 1]], mix(X, 0.95));
  });
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
