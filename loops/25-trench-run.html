<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trench Run · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Trench Run (25) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2, ph = t % 1;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  // Flug durch einen Graben wie in einem Vektor-Arcade-Spiel. Pro Loop geht es genau K Segmente nach vorn,
  // und alle Aufbauten wiederholen sich alle K Segmente: nahtlos.
  const K = 24, seg = 1, far = 16, travel = ph * K * seg;
  const camX = 0.35 * Math.sin(TAU * ph), camY = 0.1 * Math.sin(TAU * ph * 2), roll = 0.06 * Math.sin(TAU * ph);
  const fov = H * 0.62;
  const proj = (x, y, z) => {
    const dz = z - travel; if (dz < 0.15) return null;
    let X = x - camX, Y = y - camY;
    const xr = X * Math.cos(roll) - Y * Math.sin(roll), yr = X * Math.sin(roll) + Y * Math.cos(roll);
    return [W / 2 + xr / dz * fov, H / 2 - yr / dz * fov, dz];
  };
  const fog = dz => Math.max(0, Math.min(1, 1.15 - dz / far));
  const line = (a, b, col, w) => {
    const p = proj(...a), q = proj(...b); if (!p || !q) return;
    c.strokeStyle = col; c.globalAlpha = fog(Math.min(p[2], q[2])); c.lineWidth = Math.max(1, w);
    c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.stroke();
  };
  const hw = 1.0, fl = -0.9, tp = 1.6;            // halbe Grabenbreite, Boden, Oberkante
  const rnd = s => { const h = Math.sin(s * 127.1) * 43758.5453; return h - Math.floor(h); };
  const lw = H / 520;
  c.lineCap = 'round';
  const z0 = Math.floor(travel / seg) * seg;
  // Längslinien
  [-hw, -hw / 2, 0, hw / 2, hw].forEach(x => line([x, fl, travel + 0.2], [x, fl, travel + far], P.fg, lw));
  [fl + 0.8, fl + 1.6].forEach(y => { line([-hw, y, travel + 0.2], [-hw, y, travel + far], P.fg, lw); line([hw, y, travel + 0.2], [hw, y, travel + far], P.fg, lw); });
  line([-hw, tp, travel + 0.2], [-hw, tp, travel + far], P.fg, lw * 1.4); line([hw, tp, travel + 0.2], [hw, tp, travel + far], P.fg, lw * 1.4);
  line([-hw, tp, travel + 0.2], [-hw - 4, tp, travel + 0.2], P.fg, lw); line([hw, tp, travel + 0.2], [hw + 4, tp, travel + 0.2], P.fg, lw);
  // Querrippen und Aufbauten, von hinten nach vorn
  for (let z = z0 + far; z >= z0; z -= seg) {
    const idx = ((Math.round(z / seg) % K) + K) % K;
    line([-hw, fl, z], [hw, fl, z], P.fg, lw);
    line([-hw, fl, z], [-hw, tp, z], P.fg, lw); line([hw, fl, z], [hw, tp, z], P.fg, lw);
    line([-hw, tp, z], [-hw - 3, tp, z], P.fg, lw * 0.8); line([hw, tp, z], [hw + 3, tp, z], P.fg, lw * 0.8);
    const r = rnd(idx + 1);
    if (r > 0.55) {                               // Kasten an einer Wand
      const side = rnd(idx + 7) > 0.5 ? 1 : -1, x0 = side * hw, x1 = side * (hw - 0.45), y0 = fl + 0.3 + rnd(idx + 3) * 1.2, y1 = y0 + 0.5, za = z + 0.2, zb = z + 0.8;
      const box = [[x0, y0, za], [x1, y0, za], [x1, y1, za], [x0, y1, za], [x0, y0, zb], [x1, y0, zb], [x1, y1, zb], [x0, y1, zb]];
      [[0, 1], [1, 2], [2, 3], [4, 5], [5, 6], [6, 7], [1, 5], [2, 6], [3, 7], [0, 4]].forEach(([a, b]) => line(box[a], box[b], P.accent, lw * 1.3));
    }
    if (idx % 8 === 4) {                          // Querbalken über dem Graben
      line([-hw, tp - 0.25, z + 0.5], [hw, tp - 0.25, z + 0.5], P.accent, lw * 1.6);
      line([-hw, tp - 0.5, z + 0.5], [hw, tp - 0.5, z + 0.5], P.accent, lw * 1.6);
    }
  }
  c.globalAlpha = 1;
  // Fadenkreuz wie im Arcade-Cockpit
  const cx = W / 2, cy = H / 2, R = H * 0.11, k = 1 + 0.08 * Math.sin(TAU * ph * 6);
  c.strokeStyle = P.accent; c.lineWidth = Math.max(1, H / 300);
  c.beginPath(); c.arc(cx, cy, R * k, 0, TAU);
  [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => { c.moveTo(cx + dx * R * 0.6, cy + dy * R * 0.6); c.lineTo(cx + dx * R * 1.6, cy + dy * R * 1.6); });
  c.stroke();
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
