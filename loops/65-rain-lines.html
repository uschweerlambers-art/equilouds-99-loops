<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rain Lines · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Rain Lines (65) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const N = 170;
  const rnd = s => { const h = Math.sin(s) * 43758.5453; return h - Math.floor(h); };
  c.lineCap = 'round';
  for (let i = 0; i < N; i++) {
    const r1 = rnd(i * 12.98), r2 = rnd(i * 78.23), r3 = rnd(i * 39.34), r4 = rnd(i * 4.11);
    const k = 1 + Math.floor(r2 * 3), len = H * (0.04 + 0.14 * r3);
    const y = -0.2 * H + ((r4 + t * k) % 1) * H * 1.5;
    const x = r1 * W * 1.35 - y * 0.3;
    c.strokeStyle = i % 13 === 0 ? P.accent : P.fg;
    c.globalAlpha = 0.25 + 0.75 * r3;
    c.lineWidth = Math.max(1, H / 700 * (1 + 2 * r3));
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + len * 0.3, y - len); c.stroke();
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
