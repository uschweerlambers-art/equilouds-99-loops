<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Bands · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Aurora Bands (62) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = 'lighter';
  c.lineCap = 'round';
  for (let b = 0; b < 7; b++) {
    const yb = H * (0.24 + b * 0.085);
    c.beginPath();
    for (let x = -20; x <= W + 20; x += W / 120) {
      const u = x / W;
      c.lineTo(x, yb + H * 0.08 * Math.sin(TAU * (u * 1.3 + t + b * 0.13)) + H * 0.04 * Math.sin(TAU * (u * 2.7 - t * 2 + b * 0.31)));
    }
    c.strokeStyle = b % 3 === 1 ? P.accent : P.fg;
    [[0.12, 0.05], [0.05, 0.1], [0.012, 0.45]].forEach(([w, a]) => {
      c.lineWidth = H * w; c.globalAlpha = a; c.stroke();
    });
  }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
