<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fractal Tree · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfb; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Fractal Tree (50) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#fbfbfb', fg: '#151419', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  c.lineCap = 'round';
  const sway = k => 0.08 * Math.sin(TAU * (t + k * 0.11)) + 0.04 * Math.sin(TAU * (t * 2 - k * 0.07));
  const br = (x, y, len, ang, d) => {
    const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
    c.strokeStyle = d <= 2 ? P.accent : P.fg;
    c.lineWidth = Math.max(1, d * H / 520);
    c.beginPath(); c.moveTo(x, y); c.lineTo(x2, y2); c.stroke();
    if (d > 1) {
      const spread = 0.42 + 0.1 * Math.sin(TAU * (t + d * 0.05));
      br(x2, y2, len * 0.74, ang - spread + sway(d), d - 1);
      br(x2, y2, len * 0.74, ang + spread + sway(d + 3), d - 1);
    }
  };
  br(W / 2, H * 0.99, H * 0.23, -Math.PI / 2 + sway(0) * 0.5, 11);
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
