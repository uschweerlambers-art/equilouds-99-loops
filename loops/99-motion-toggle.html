<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Toggle · Equilouds 99 Loops</title>
<style>
  /* Motion Toggle (99) · Equilouds 99 Loops · uweschweerlambers.de · License: MIT, free to use, commercial use included */
  :root { --bg: #151419; --fg: #fbfbfb; --accent: #f56e0f; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font-size: 18px; }

.switch { display: inline-flex; align-items: center; gap: .8em; color: var(--fg); font: 600 1em/1 system-ui, sans-serif; cursor: pointer; }
.switch input { appearance: none; -webkit-appearance: none; margin: 0; position: relative; width: 3.4em; height: 1.9em; border-radius: 999px; background: color-mix(in srgb, var(--fg) 25%, transparent); cursor: pointer; transition: background .3s; }
.switch input::before { content: ""; position: absolute; top: .2em; left: .2em; width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--fg); transition: transform .35s cubic-bezier(.3,1.4,.5,1), background .3s; }
.switch input:checked { background: var(--accent); animation: glow 2.4s ease-in-out infinite; }
.switch input:checked::before { transform: translateX(1.5em); background: var(--bg); }
.switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@keyframes glow { 50% { box-shadow: 0 0 0 .35em color-mix(in srgb, var(--accent) 25%, transparent); } }
</style>
</head>
<body>
  <label class="switch"><input type="checkbox" checked> Motion on</label>
</body>
</html>
