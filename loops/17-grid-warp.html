<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Warp · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Grid Warp (17) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const g = H / 14, amp = g * 0.6;
  const warp = (x, y) => {
    const d = Math.hypot(x - W / 2, y - H / 2) / H;
    const k = Math.sin(TAU * (d * 1.6 - t * 2)) * Math.exp(-d * 1.2);
    const a = Math.atan2(y - H / 2, x - W / 2);
    return [x + Math.cos(a) * k * amp, y + Math.sin(a) * k * amp, k];
  };
  c.lineWidth = Math.max(1, H / 600); c.strokeStyle = P.fg;
  const x0 = (W / 2) % g - g, y0 = (H / 2) % g - g;
  for (let x = x0; x <= W + g; x += g) {
    c.beginPath(); for (let y = -g; y <= H + g; y += g / 4) { const p = warp(x, y); c.lineTo(p[0], p[1]); } c.stroke();
  }
  for (let y = y0; y <= H + g; y += g) {
    c.beginPath(); for (let x = -g; x <= W + g; x += g / 4) { const p = warp(x, y); c.lineTo(p[0], p[1]); } c.stroke();
  }
  c.fillStyle = P.accent;
  for (let x = x0; x <= W + g; x += g) for (let y = y0; y <= H + g; y += g) {
    const p = warp(x, y);
    if (p[2] > 0.35) { c.beginPath(); c.arc(p[0], p[1], H / 220 * (1 + p[2]), 0, TAU); c.fill(); }
  }
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
