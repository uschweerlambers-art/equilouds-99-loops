<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyramid Spin · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Pyramid Spin (32) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  const hx = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));
  const B = hx(P.bg), F = hx(P.fg);
  const mix = k => 'rgb(' + B.map((b, i) => Math.round(b + (F[i] - b) * k)).join(',') + ')';
  const V = [[-1, 0.8, -1], [1, 0.8, -1], [1, 0.8, 1], [-1, 0.8, 1], [0, -1.1, 0]];
  const FACES = [[0, 1, 2, 3], [0, 1, 4], [1, 2, 4], [2, 3, 4], [3, 0, 4]];
  const ay = TAU * t, ax = 0.32 + 0.1 * Math.sin(TAU * t * 2), sz = H * 0.22, bob = Math.sin(TAU * t * 2) * H * 0.02;
  c.fillStyle = P.fg; c.globalAlpha = 0.12; c.beginPath(); c.ellipse(W / 2, H * 0.8, sz * 1.3 - bob, sz * 0.22, 0, 0, TAU); c.fill(); c.globalAlpha = 1;
  const pts = V.map(([x, y, z]) => {
    const X = x * Math.cos(ay) + z * Math.sin(ay), Z0 = -x * Math.sin(ay) + z * Math.cos(ay);
    return [X, y * Math.cos(ax) - Z0 * Math.sin(ax), y * Math.sin(ax) + Z0 * Math.cos(ax)];
  });
  const proj = p => { const f = 5 / (5 + p[2]); return [W / 2 + p[0] * sz * f, H * 0.47 + bob + p[1] * sz * f]; };
  const fs = FACES.map(f => {
    const p = f.map(k => pts[k]);
    const u = [0, 1, 2].map(k => p[1][k] - p[0][k]), v = [0, 1, 2].map(k => p[2][k] - p[0][k]);
    let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
    const cen = [0, 1, 2].map(k => p.reduce((s, q) => s + q[k], 0) / p.length);
    if (n[0] * cen[0] + n[1] * cen[1] + n[2] * cen[2] < 0) n = n.map(x => -x);
    const l = Math.hypot(n[0], n[1], n[2]); n = n.map(x => x / l);
    return { p, n, z: cen[2] };
  }).filter(f => f.n[2] < 0).sort((a, b) => b.z - a.z);
  fs.forEach(f => {
    const lit = Math.max(0, f.n[0] * -0.5 + f.n[1] * -0.6 + f.n[2] * -0.62);
    c.beginPath(); f.p.forEach(q => { const s = proj(q); c.lineTo(s[0], s[1]); }); c.closePath();
    c.fillStyle = mix(0.1 + 0.9 * lit); c.fill();
    c.strokeStyle = P.accent; c.lineWidth = H / 400; c.lineJoin = 'round'; c.stroke();
  });
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
