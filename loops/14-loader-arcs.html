<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader Arcs · Equilouds 99 Loops</title>
<style>
  html, body { margin: 0; height: 100%; background: #151419; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="loop"></canvas>
<script>
// Loader Arcs (14) · Equilouds 99 Loops
// Uwe Schweer-Lambers / EQUILOUD · uweschweerlambers.de
// License: MIT, free to use, commercial use included
const W = 1920, H = 1080;   // output size in px
const DUR = 12;             // seconds per loop, seamless
const P = { bg: '#151419', fg: '#fbfbfb', accent: '#f56e0f' };

function draw(c, t, W, H, P) {
  const TAU = Math.PI * 2;
  c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
  c.lineCap = 'round'; c.lineWidth = H * 0.022;
  for (let k = 0; k < 4; k++) {
    const R = H * (0.12 + k * 0.065);
    const rot = TAU * t * (k % 2 ? -(k + 1) : k + 1);
    const len = TAU * (0.15 + 0.35 * (0.5 + 0.5 * Math.sin(TAU * (t * 2 + k * 0.2))));
    c.strokeStyle = k === 0 ? P.accent : P.fg;
    c.globalAlpha = 1 - k * 0.18;
    c.beginPath(); c.arc(W / 2, H / 2, R, rot, rot + len); c.stroke();
  }
  c.globalAlpha = 1;
}

const cv = document.getElementById('loop');
cv.width = W; cv.height = H;
const c = cv.getContext('2d');
function frame(ms) {
  draw(c, (ms / 1000 / DUR) % 1, W, H, P);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
